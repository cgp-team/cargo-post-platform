openapi: 3.1.0
info:
  title: 客货邮路线规划算法 API
  version: 0.2.0
  description: |
    业务后端与路线规划算法服务之间的接口契约，已与算法组 2026-08-09 书面回复对齐。
    浏览器不得直接调用；仅 transport 模块算法适配层可访问。

    要点：
    - 提交任务后同步计算最长 10 秒；超时返回 408，凭 requestId 轮询结果。
    - requestId 幂等保留 24 小时，重复提交返回缓存结果（cached: true）。
    - 坐标统一 GCJ-02；当前距离按欧氏直线计算，后续切换高德路网距离。
    - 静态闭环：车辆空载从场站出发并返回；算法自动判定启用车辆数。
    - 规模上限：30 站点 / 25 订单（乘客+包裹合计）/ 3 车 / 10 秒计算超时。
    - 无解语义存在待澄清矛盾：Q10 回复为 200 + status=infeasible，
      Q12 回复将 422 标注为业务不可行。适配层需同时兼容两种返回。
servers:
  - url: http://mock-algorithm:8000
    description: Docker 内部开发地址
paths:
  /api/v1/plan:
    post:
      operationId: createPlan
      summary: 提交规划任务
      description: 同步计算最长 10 秒。成功返回 200 + 规划结果；超时返回 408 + requestId，凭 requestId 轮询 `/api/v1/result/{requestId}`。相同 requestId 重复提交返回首次缓存结果。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanRequest'
            example:
              requestId: req-20260809-0800
              batchStart: '2026-08-09T08:00:00+08:00'
              batchEnd: '2026-08-09T08:30:00+08:00'
              depot:
                stationId: S0
                longitude: 104.0668
                latitude: 30.5728
              stations:
                - stationId: S1
                  longitude: 104.0601
                  latitude: 30.5801
                - stationId: S2
                  longitude: 104.0523
                  latitude: 30.6102
              vehicles:
                - vehicleId: 1001
                  passengerCapacity: 5
                  cargoCapacity: 4
                - vehicleId: 1002
                  passengerCapacity: 5
                  cargoCapacity: 4
              orders:
                - orderId: O-P001
                  orderType: PASSENGER
                  boardingStationId: S1
                  alightingStationId: S2
                - orderId: O-D001
                  orderType: DELIVERY
                  stationId: S2
                  itemCount: 1
                - orderId: O-U001
                  orderType: PICKUP
                  stationId: S1
                  itemCount: 1
              algorithmConfig:
                ant_count: 30
                max_iterations: 100
      responses:
        '200':
          description: 规划完成（含幂等缓存命中）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResult'
        '400':
          $ref: '#/components/responses/Error'
        '408':
          description: 计算超时（10 秒），凭 requestId 轮询结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: 规模超限（30 站点 / 25 订单 / 3 车），不可重试
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 业务不可行/无解（算法组 Q12 回复标注；与 200 + status=infeasible 并存，待澄清），不可重试
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/result/{requestId}:
    get:
      operationId: getPlanResult
      summary: 轮询规划结果
      description: 轮询间隔建议 ≥ 2 秒。requestId 保留 24 小时，过期后查询返回 404。
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 规划结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResult'
        '202':
          description: 仍在计算中
        '404':
          description: requestId 不存在或已超过 24 小时幂等保留期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/distance:
    post:
      operationId: getDistance
      summary: 两站点间距离/耗时查询（寄货页取货→送达）
      description: 复用高德路网矩阵。未配置 AMAP_KEY 或高德不可用时返回欧氏直线（distanceUnit=degree，durationSeconds 为 null，由业务侧换算/兜底）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DistanceRequest'
            example:
              requestId: req-dist-20260824-0001
              stations:
                - stationId: S1
                  longitude: 104.1234
                  latitude: 30.6012
                - stationId: S2
                  longitude: 104.0657
                  latitude: 30.5723
      responses:
        '200':
          description: 距离查询结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistanceResponse'
        '400':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/route:
    post:
      operationId: getRoute
      summary: 坐标→坐标单路线查询（实时公交 ETA：车辆位置 → 下一站）
      description: 复用高德路网单路线能力（与派单/寄货同一套 AmapDistanceProvider）。未配置 AMAP_KEY / 高德失败降级直线估算（provider=euclidean，明确标注）；明确不可达返回 available=false + reasonCode=ROUTE_UNAVAILABLE。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteRequest'
            example:
              origin: { latitude: 30.5723, longitude: 104.0657 }
              destination: { latitude: 30.6012, longitude: 104.1234 }
      responses:
        '200':
          description: 单路线结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteResponse'
        '422':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /health:
    get:
      operationId: health
      summary: 存活检查
      responses:
        '200':
          description: 服务正常
  /ready:
    get:
      operationId: ready
      summary: 就绪检查
      description: 模型加载完毕后返回 200，未就绪返回 503。
      responses:
        '200':
          description: 已就绪
        '503':
          description: 未就绪
components:
  parameters:
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: 标准错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    PlanRequest:
      type: object
      required: [requestId, batchStart, batchEnd, depot, stations, vehicles, orders]
      properties:
        requestId:
          type: string
          description: 全局唯一请求标识，幂等键，保留 24 小时
        batchStart:
          type: string
          format: date-time
          description: 半小时批次区间开始，带时区 ISO 8601
          example: '2026-08-09T08:00:00+08:00'
        batchEnd:
          type: string
          format: date-time
          description: 半小时批次区间结束
          example: '2026-08-09T08:30:00+08:00'
        depot:
          $ref: '#/components/schemas/Station'
        stations:
          type: array
          maxItems: 30
          description: 全部服务站点（含场站），GCJ-02 坐标
          items:
            $ref: '#/components/schemas/Station'
        vehicles:
          type: array
          maxItems: 3
          description: 本批次可用车辆，空载从场站出发；算法自动判定启用数量
          items:
            $ref: '#/components/schemas/Vehicle'
        orders:
          type: array
          maxItems: 25
          description: 乘客+包裹订单合计不超过 25
          items:
            $ref: '#/components/schemas/PlanOrder'
        algorithmConfig:
          $ref: '#/components/schemas/AlgorithmConfig'
        scenario:
          type: string
          enum: [SUCCESS, PARTIAL_REJECTION, NO_FEASIBLE_SOLUTION, TIMEOUT, INTERNAL_ERROR]
          default: SUCCESS
          description: 仅供 Mock 测试，真实算法可忽略。
    Station:
      type: object
      required: [stationId, longitude, latitude]
      properties:
        stationId:
          type: string
        longitude:
          type: number
          format: double
          description: GCJ-02 经度
        latitude:
          type: number
          format: double
          description: GCJ-02 纬度
    Vehicle:
      type: object
      required: [vehicleId]
      properties:
        vehicleId:
          type: integer
          format: int64
        passengerCapacity:
          type: integer
          minimum: 1
          default: 5
          description: 实时最大载客人数
        cargoCapacity:
          type: integer
          minimum: 1
          default: 4
          description: 货仓实时最大包裹件数
    PlanOrder:
      type: object
      required: [orderId, orderType]
      properties:
        orderId:
          type: string
        orderType:
          type: string
          enum: [PASSENGER, DELIVERY, PICKUP]
          description: PASSENGER 客运 / DELIVERY 派送（站点卸货）/ PICKUP 揽收（站点收货）
        boardingStationId:
          type: string
          description: 客运订单上车站；强制先上车后下车
        alightingStationId:
          type: string
          description: 客运订单下车站
        stationId:
          type: string
          description: 派送/揽收订单的作业站点
        itemCount:
          type: integer
          minimum: 1
          default: 1
          description: 件数（容量只按件数约束）
        weightKg:
          type: number
          minimum: 0
          description: 保留字段，算法不校验
        volumeM3:
          type: number
          minimum: 0
          description: 保留字段，算法不校验
    AlgorithmConfig:
      type: object
      additionalProperties: true
      description: ACO 超参数，全部可选，不传用默认值；超出建议范围时响应带 warnings 不拒绝
      properties:
        ant_count:
          type: integer
          default: 30
          description: 蚂蚁种群数量
        max_iterations:
          type: integer
          default: 100
          description: 最大迭代次数
        alpha:
          type: number
          default: 1.0
          description: 信息素重要因子
        beta:
          type: number
          default: 3.0
          description: 启发因子
        rho:
          type: number
          default: 0.1
          description: 信息素挥发系数
        Q:
          type: number
          default: 100
          description: 信息素增量系数
        convergence_threshold:
          type: integer
          default: 20
          description: 收敛判定阈值（连续无变化代数）
    PlanResult:
      type: object
      required: [requestId, status, cached, algorithmVersion, vehiclePlans]
      properties:
        requestId:
          type: string
        status:
          type: string
          enum: [feasible, infeasible]
          description: feasible 完整解；infeasible 无解并附 reasonCode
        reasonCode:
          type: string
          enum: [OVER_CAPACITY, TIMING_CONFLICT, PARTIAL_ONLY]
          description: 无解原因码；PARTIAL_ONLY 语义待澄清（当前按不返回部分方案处理）
        cached:
          type: boolean
          description: 是否为幂等缓存命中（重复提交不重新计算）
        warnings:
          type: array
          description: algorithmConfig 超出建议范围等非致命告警
          items:
            type: string
        algorithmVersion:
          type: string
          description: 随 Docker 镜像版本管理
          example: aco-1.0.0
        parameterVersion:
          type: string
          description: 默认参数版本，镜像 CHANGELOG 记录变更
        totalDistance:
          type: number
          format: double
          description: 全部车辆行驶里程累加值（算法唯一直接产出的指标）；单位见 distanceUnit
        distanceUnit:
          type: string
          enum: [degree, km]
          description: 里程单位——degree=经纬度欧氏距离（业务后端 Haversine 换算公里）；km=路网真实公里（直接使用）。自研服务 v1.1.0 起输出
        vehiclePlans:
          type: array
          items:
            $ref: '#/components/schemas/VehiclePlan'
        computedAt:
          type: string
          format: date-time
    VehiclePlan:
      type: object
      required: [vehicleId, stops, totalDistance]
      properties:
        vehicleId:
          type: integer
          format: int64
        stops:
          type: array
          description: 闭环站点访问序列，首末均为场站
          items:
            $ref: '#/components/schemas/RouteStop'
        totalDistance:
          type: number
          format: double
          description: 本车单次往返总里程
    RouteStop:
      type: object
      required: [stationId, action]
      properties:
        stationId:
          type: string
        orderId:
          type: string
          description: 该站点作业的订单（场站起止点无此字段）
        action:
          type: string
          enum: [DEPART, BOARD, ALIGHT, DELIVER, PICKUP, RETURN]
          description: 出发 / 接客 / 送客 / 派送卸货 / 揽收装货 / 返回场站
        segmentDistance:
          type: number
          format: double
          description: 与上一站点间的分段里程（单位随 distanceUnit）
        segmentDuration:
          type: number
          format: double
          description: 与上一站点间的分段路网行驶秒数；仅 distanceUnit=km（路网路径）时给出，业务后端据此估算每站到达时刻，缺省时按直线÷均速兜底
    DistanceRequest:
      type: object
      required: [requestId, stations]
      properties:
        requestId:
          type: string
          description: 全局唯一请求标识，幂等键
        stations:
          type: array
          minItems: 2
          maxItems: 2
          description: 恰好两个站点，顺序为 [取货站, 送达站]，GCJ-02 坐标
          items:
            $ref: '#/components/schemas/DistancePoint'
    DistancePoint:
      type: object
      required: [stationId, longitude, latitude]
      properties:
        stationId:
          type: string
        longitude:
          type: number
          format: double
          description: GCJ-02 经度
        latitude:
          type: number
          format: double
          description: GCJ-02 纬度
    DistancePair:
      type: object
      required: [fromStationId, toStationId]
      properties:
        fromStationId:
          type: string
          description: 起点（取货站）站点标识
        toStationId:
          type: string
          description: 终点（送达站）站点标识
        distanceKm:
          type: number
          format: double
          description: 里程（恒为公里 km）；高德路网真实公里 / 直线估算 Haversine 公里，均不重复换算
        durationSeconds:
          type: number
          format: double
          description: 行驶秒数；高德路网真实秒，直线估算按均速换算的秒；不可达时省略
        provider:
          type: string
          enum: [amap, euclidean]
          description: 数据来源——amap=高德路网真实距离；euclidean=直线估算降级（高德失败/未配置 key）
        available:
          type: boolean
          default: true
          description: 是否可用——false 表示该点对明确不可达（高德无可行车道路），无 distanceKm/durationSeconds
    DistanceResponse:
      type: object
      required: [requestId, distanceUnit, pairs]
      properties:
        requestId:
          type: string
        distanceUnit:
          type: string
          enum: [km]
          description: 恒为 km（高德路网公里 / 直线估算 Haversine 公里），不做 degree 换算
        pairs:
          type: array
          description: 查询的站点对结果（本接口固定 1 对）
          items:
            $ref: '#/components/schemas/DistancePair'
        computedAt:
          type: string
          format: date-time
    RouteRequest:
      type: object
      required: [origin, destination]
      properties:
        origin:
          $ref: '#/components/schemas/RoutePoint'
        destination:
          $ref: '#/components/schemas/RoutePoint'
    RoutePoint:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: GCJ-02 纬度
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: GCJ-02 经度
    RouteResponse:
      type: object
      required: [available]
      properties:
        available:
          type: boolean
          description: 是否可用（false=明确不可达）
        distanceKm:
          type: number
          format: double
          description: 距离（恒为公里 km；高德真实 / 直线估算 Haversine）
        durationSeconds:
          type: number
          format: double
          description: 行驶秒数（高德真实秒 / 直线估算按均速换算秒）
        provider:
          type: string
          enum: [amap, euclidean]
          description: 数据来源
        reasonCode:
          type: string
          enum: [ROUTE_UNAVAILABLE]
          description: 不可用时原因码
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [INVALID_INPUT, OVER_LIMIT, INFEASIBLE, TIMEOUT, REQUEST_NOT_FOUND, NOT_READY, SERVICE_BUSY, ALGORITHM_INTERNAL_ERROR]
        message:
          type: string
        requestId:
          type: string
        details:
          type: object
          additionalProperties: true
