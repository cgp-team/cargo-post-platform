openapi: 3.1.0
info:
  title: 客货邮路线规划算法 API
  version: 0.2.0
  description: |
    业务后端与路线规划算法服务之间的接口契约，已与算法组 2026-08-09 书面回复对齐。
    浏览器不得直接调用；仅 transport 模块算法适配层可访问。

    要点：
    - 提交任务后同步计算最长 10 秒；超时返回 408，凭 requestId 轮询结果。
    - requestId 幂等保留 24 小时，重复提交返回缓存结果（cached: true）。
    - 坐标统一 GCJ-02；当前距离按欧氏直线计算，后续切换高德路网距离。
    - 静态闭环：车辆空载从场站出发并返回；算法自动判定启用车辆数。
    - 规模上限：算法服务自身接受 100 站点 / 25 订单 / 3 车 / 10 秒计算超时；
      业务适配层（transport 模块）按 30 站点预检并缩批，因此调用方实际可用上限是 30 站点。
      两侧都还没按需求动态推导：抬车辆上限受"候选车翻倍反而解更差"（构造侧对称破缺未解）阻塞，
      抬站点上限要等它一起解决，在此之前请勿把调用方批次放到 30 以上。
    - 部分解语义：本趟带不下的货运单不阻断整批，status 仍为 feasible，
      单号进 unassignedOrderIds，由业务侧转多段联运（MultiLegPlanner）接力；乘客单永不进该名单。
    - 无解语义存在待澄清矛盾：Q10 回复为 200 + status=infeasible，
      Q12 回复将 422 标注为业务不可行。适配层需同时兼容两种返回。
servers:
  - url: http://algorithm:8000
    description: Docker 内部开发地址
paths:
  /api/v1/plan:
    post:
      operationId: createPlan
      summary: 提交规划任务
      description: 同步计算最长 10 秒。成功返回 200 + 规划结果；超时返回 408 + requestId，凭 requestId 轮询 `/api/v1/result/{requestId}`。相同 requestId 重复提交返回首次缓存结果。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanRequest'
            example:
              requestId: req-20260809-0800
              batchStart: '2026-08-09T08:00:00+08:00'
              batchEnd: '2026-08-09T08:30:00+08:00'
              depot:
                stationId: S0
                longitude: 104.0668
                latitude: 30.5728
              stations:
                - stationId: S1
                  longitude: 104.0601
                  latitude: 30.5801
                - stationId: S2
                  longitude: 104.0523
                  latitude: 30.6102
              vehicles:
                - vehicleId: 1001
                  passengerCapacity: 5
                  cargoCapacity: 4
                - vehicleId: 1002
                  passengerCapacity: 5
                  cargoCapacity: 4
              orders:
                - orderId: O-P001
                  orderType: PASSENGER
                  boardingStationId: S1
                  alightingStationId: S2
                - orderId: O-D001
                  orderType: DELIVERY
                  stationId: S2
                  itemCount: 1
                  readyTime: '2026-08-09T08:05:00+08:00'
                  deliveryDeadline: '2026-08-09T08:40:00+08:00'
                - orderId: O-U001
                  orderType: PICKUP
                  stationId: S1
                  itemCount: 1
                  readyTime: '2026-08-09T08:10:00+08:00'
              shipments:
                - shipmentId: TP001
                  pickupStationId: S1
                  deliveryStationId: S2
                  quantity: 2
                  weightKg: 5.5
                  readyTime: '2026-08-09T08:10:00+08:00'
                  deliveryDeadline: '2026-08-09T08:25:00+08:00'
              algorithmConfig:
                ant_count: 24
                max_iterations: 8
      responses:
        '200':
          description: 规划完成（含幂等缓存命中）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResult'
        '400':
          $ref: '#/components/responses/Error'
        '408':
          description: 计算超时（10 秒），凭 requestId 轮询结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: 规模超限（算法服务按自身的 100 站点 / 25 订单 / 3 车判定；业务适配层更早按 30 站点缩批），不可重试
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 业务不可行/无解（算法组 Q12 回复标注；与 200 + status=infeasible 并存，待澄清），不可重试
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/result/{requestId}:
    get:
      operationId: getPlanResult
      summary: 轮询规划结果
      description: 轮询间隔建议 ≥ 2 秒。requestId 保留 24 小时，过期后查询返回 404。
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 规划结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResult'
        '202':
          description: 仍在计算中
        '404':
          description: requestId 不存在或已超过 24 小时幂等保留期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/distance:
    post:
      operationId: getDistance
      summary: 两站点间距离/耗时查询（寄货页取货→送达）
      description: 复用高德路网矩阵。未配置 AMAP_KEY 或高德不可用时返回欧氏直线（distanceUnit=degree，durationSeconds 为 null，由业务侧换算/兜底）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DistanceRequest'
            example:
              requestId: req-dist-20260824-0001
              stations:
                - stationId: S1
                  longitude: 104.1234
                  latitude: 30.6012
                - stationId: S2
                  longitude: 104.0657
                  latitude: 30.5723
      responses:
        '200':
          description: 距离查询结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistanceResponse'
        '400':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/route:
    post:
      operationId: getRoute
      summary: 坐标→坐标单路线查询（实时公交 ETA：车辆位置 → 下一站）
      description: 复用高德路网单路线能力（与派单/寄货同一套 AmapDistanceProvider）。未配置 AMAP_KEY / 高德失败降级直线估算（provider=euclidean，明确标注）；明确不可达返回 available=false + reasonCode=ROUTE_UNAVAILABLE。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteRequest'
            example:
              origin: { latitude: 30.5723, longitude: 104.0657 }
              destination: { latitude: 30.6012, longitude: 104.1234 }
      responses:
        '200':
          description: 单路线结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteResponse'
        '422':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /health:
    get:
      operationId: health
      summary: 存活检查
      responses:
        '200':
          description: 服务正常
  /ready:
    get:
      operationId: ready
      summary: 就绪检查
      description: 模型加载完毕后返回 200，未就绪返回 503。
      responses:
        '200':
          description: 已就绪
        '503':
          description: 未就绪
components:
  parameters:
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: 标准错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    PlanRequest:
      type: object
      required: [requestId, batchStart, batchEnd, depot, stations, vehicles, orders]
      properties:
        requestId:
          type: string
          description: 全局唯一请求标识，幂等键，保留 24 小时
        batchStart:
          type: string
          format: date-time
          description: 半小时批次区间开始，带时区 ISO 8601
          example: '2026-08-09T08:00:00+08:00'
        batchEnd:
          type: string
          format: date-time
          description: 半小时批次区间结束
          example: '2026-08-09T08:30:00+08:00'
        depot:
          $ref: '#/components/schemas/Station'
        stations:
          type: array
          maxItems: 100
          description: 全部服务站点（含场站），GCJ-02 坐标。算法服务接受到 100；业务适配层按 30 预检缩批
          items:
            $ref: '#/components/schemas/Station'
        vehicles:
          type: array
          maxItems: 3
          description: 本批次可用车辆，空载从场站出发；算法自动判定启用数量
          items:
            $ref: '#/components/schemas/Vehicle'
        orders:
          type: array
          maxItems: 25
          description: 乘客+包裹订单与配对货运单（shipments）合计不超过 25，超出返回 413
          items:
            $ref: '#/components/schemas/PlanOrder'
        shipments:
          type: array
          description: |
            配对货运单（揽收→送达，同一辆车、先取后送）。取货站与送达站都不是场站的完整链路
            必须走这里：拆成两个单向订单会丢掉"同车 + 先取后送"约束，等于货凭空出现在送达站。
          items:
            $ref: '#/components/schemas/PlanShipment'
        algorithmConfig:
          $ref: '#/components/schemas/AlgorithmConfig'
        scenario:
          type: string
          enum: [SUCCESS, PARTIAL_REJECTION, NO_FEASIBLE_SOLUTION, TIMEOUT, INTERNAL_ERROR]
          default: SUCCESS
          description: 仅供 Mock 测试，真实算法可忽略。
    Station:
      type: object
      required: [stationId, longitude, latitude]
      properties:
        stationId:
          type: string
        longitude:
          type: number
          format: double
          description: GCJ-02 经度
        latitude:
          type: number
          format: double
          description: GCJ-02 纬度
    Vehicle:
      type: object
      required: [vehicleId]
      properties:
        vehicleId:
          type: integer
          format: int64
        passengerCapacity:
          type: integer
          minimum: 1
          default: 5
          description: 实时最大载客人数
        cargoCapacity:
          type: integer
          minimum: 1
          default: 4
          description: 货仓实时最大包裹件数
        cargoWeightCapacityKg:
          type: number
          format: double
          minimum: 0
          description: |
            货仓最大载重（kg），取车辆档案 transport_vehicle.cargo_capacity_kg。
            下发后 PlanOrder/PlanShipment 的 weightKg 才真正参与可行性判定
            （超载单被舍弃进 unassignedOrderIds，不阻断整批）；缺省时只按件数约束。
        cargoVolumeCapacityM3:
          type: number
          format: double
          minimum: 0
          description: 货仓最大体积（m³）；同上，缺省时算法不按体积判定，不替业务编造上限
        initialPassengerLoad:
          type: integer
          minimum: 0
          default: 0
          description: 出发时车上已有乘客数（上一站上车未下车），需 < passengerCapacity
        initialCargoLoad:
          type: integer
          minimum: 0
          default: 0
          description: 出发时已预装货件数（场站预装派送件），需 <= cargoCapacity
        skeleton:
          type: array
          items:
            type: string
          description: |
            公交骨架（Mandatory Passenger Service）：该车辆必须按序经停的站点编号（不含场站）。
            提供时货运任务只能插进骨架间隙（顺路带货、有先后、不掉头）；缺省为纯 VRP。
    PlanShipment:
      type: object
      required: [shipmentId, pickupStationId, deliveryStationId, quantity]
      properties:
        shipmentId:
          type: string
        pickupStationId:
          type: string
        deliveryStationId:
          type: string
        quantity:
          type: integer
          minimum: 1
        weightKg:
          type: number
          minimum: 0
          description: 货运子表真实录入值；车辆下发 cargoWeightCapacityKg 时参与可行性判定
        volumeM3:
          type: number
          minimum: 0
        economicValue:
          type: number
          minimum: 0
          description: 业务层真实报价；缺失时算法不报错、不造假价格，仅用于性价比比较
        readyTime:
          type: string
          format: date-time
          description: |
            包裹最早可取时刻（transport_order.earliest_pickup_time）。早于该时刻到达不算迟到，
            但必须等到能取件才揽收，等待计入班次时长。
        pickupDeadline:
          type: string
          format: date-time
          description: 揽收截止；业务侧尚无对应字段时不下发，算法不凭空判迟到
        deliveryDeadline:
          type: string
          format: date-time
          description: 送达截止（transport_order.latest_delivery_time）；方案完成时刻晚于此判 ETA_MISSED_DELIVERY
        priority:
          type: integer
          minimum: 0
          default: 0
          description: 越大越先获得稀缺舱位/时间余量；不下发时按单号确定性排序，与旧行为等价
        roadAccess:
          type: string
          enum: [BLOCKED, NEAR_STATION]
          description: |
            公交通行预检结论：BLOCKED=站点档案标注车辆不可进入，算法不得安排绕行上门，
            改为最近骨架站交接（两腿一起挪，配对单不能只挪一条腿）；NEAR_STATION=点位距最近站 ≤100 m。
            缺省 null = 未预检，行为与历史一致。
    PlanOrder:
      type: object
      required: [orderId, orderType]
      properties:
        orderId:
          type: string
        orderType:
          type: string
          enum: [PASSENGER, DELIVERY, PICKUP]
          description: PASSENGER 客运 / DELIVERY 派送（站点卸货）/ PICKUP 揽收（站点收货）
        boardingStationId:
          type: string
          description: 客运订单上车站；强制先上车后下车
        alightingStationId:
          type: string
          description: 客运订单下车站
        stationId:
          type: string
          description: 派送/揽收订单的作业站点
        itemCount:
          type: integer
          minimum: 1
          default: 1
          description: 件数（容量只按件数约束）
        weightKg:
          type: number
          minimum: 0
          description: 货运子表真实录入值；车辆下发 cargoWeightCapacityKg 时参与可行性判定，否则只按件数
        volumeM3:
          type: number
          minimum: 0
          description: 同上，需车辆下发 cargoVolumeCapacityM3 才生效
        roadAccess:
          type: string
          enum: [BLOCKED, NEAR_STATION]
          description: 同 PlanShipment.roadAccess；仅标注货运作业点，客运单永不标注（每站必停拉客）
        readyTime:
          type: string
          format: date-time
          description: |
            同 PlanShipment.readyTime（transport_order.earliest_pickup_time）。派送/揽收都按各自的
            事件点等待；客运单不下发（乘客点位不由算法改派）。
        pickupDeadline:
          type: string
          format: date-time
          description: 揽收截止；业务侧尚无对应字段时不下发，算法不凭空判迟到
        deliveryDeadline:
          type: string
          format: date-time
          description: |
            送达截止（transport_order.latest_delivery_time）。
            DELIVERY 派送单有 DELIVER 事件锚点 ⇒ 判 ETA_MISSED_DELIVERY；
            PICKUP 揽收单暂无事件锚点（货随车回场站才算送达，而收班事件不带 task_id）⇒
            下发是让请求自证事实，算法当前不据它判迟到，这一侧仍由批窗 batchEnd 兜住。
        priority:
          type: integer
          minimum: 0
          default: 0
          description: 越大越先获得稀缺舱位/时间余量；不下发时按单号确定性排序，与旧行为等价
    AlgorithmConfig:
      type: object
      additionalProperties: true
      description: ACO 超参数，全部可选，不传用默认值；超出建议范围时响应带 warnings 不拒绝
      properties:
        ant_count:
          type: integer
          default: 24
          description: 蚂蚁种群数量（业务适配层默认与此一致，勿两侧各写一套）
        max_iterations:
          type: integer
          default: 8
          description: 最大迭代次数（实测 2~8 最优，更深目标反而变差，收尾精修由 ALNS 负责）
        alpha:
          type: number
          default: 1.0
          description: 信息素重要因子
        beta:
          type: number
          default: 3.0
          description: 启发因子
        rho:
          type: number
          default: 0.1
          description: 信息素挥发系数
        Q:
          type: number
          default: 100
          description: 信息素增量系数
        convergence_threshold:
          type: integer
          default: 20
          description: 收敛判定阈值（连续无变化代数）
    PlanResult:
      type: object
      required: [requestId, status, cached, algorithmVersion, vehiclePlans]
      properties:
        requestId:
          type: string
        status:
          type: string
          enum: [feasible, infeasible]
          description: feasible 完整解；infeasible 无解并附 reasonCode
        reasonCode:
          type: string
          enum: [OVER_CAPACITY, TIMING_CONFLICT, PARTIAL_ONLY]
          description: |
            无解原因码。部分可完成不走 infeasible：算法返回 status=feasible + 完整车辆方案，
            带不下的货运单号进 unassignedOrderIds（PARTIAL_ONLY 保留给"只给状态不给方案"的历史口径，
            当前算法服务不再产生它）。
        cached:
          type: boolean
          description: 是否为幂等缓存命中（重复提交不重新计算）
        warnings:
          type: array
          description: |
            algorithmConfig 超出建议范围等非致命告警，以及求解遥测（如 DISCARDED_CAPACITY_OVERFLOW=…、
            CARGO_OVERFLOW_SHEDDING=…、SEARCH_START_MS=…）。业务侧应至少持久化以便复盘"为什么少了单"。
          items:
            type: string
        unassignedOrderIds:
          type: array
          items:
            type: string
          description: |
            本趟带不下的单号（订单号或 shipmentId）：绕行超阈值、载重/体积超舱、可证明迟到都走这里，
            业务侧转多段联运接力，不整批失败。硬约束：客运单永不出现在此名单（乘客不可舍弃），
            且声明未分配的单号不得同时出现在 vehiclePlans 里。
        algorithmVersion:
          type: string
          description: 随 Docker 镜像版本管理
          example: aco-1.0.0
        parameterVersion:
          type: string
          description: 默认参数版本，镜像 CHANGELOG 记录变更
        totalDistance:
          type: number
          format: double
          description: 全部车辆行驶里程累加值（算法唯一直接产出的指标）；单位见 distanceUnit
        distanceUnit:
          type: string
          enum: [degree, km]
          description: 里程单位——degree=经纬度欧氏距离（业务后端 Haversine 换算公里）；km=路网真实公里（直接使用）。自研服务 v1.1.0 起输出
        vehiclePlans:
          type: array
          items:
            $ref: '#/components/schemas/VehiclePlan'
        computedAt:
          type: string
          format: date-time
    VehiclePlan:
      type: object
      required: [vehicleId, stops, totalDistance]
      properties:
        vehicleId:
          type: integer
          format: int64
        stops:
          type: array
          description: 闭环站点访问序列，首末均为场站
          items:
            $ref: '#/components/schemas/RouteStop'
        totalDistance:
          type: number
          format: double
          description: 本车单次往返总里程
    RouteStop:
      type: object
      required: [stationId, action]
      properties:
        stationId:
          type: string
        orderId:
          type: string
          description: 该站点作业的订单（场站起止点无此字段）
        action:
          type: string
          enum: [DEPART, BOARD, ALIGHT, DELIVER, PICKUP, RETURN]
          description: 出发 / 接客 / 送客 / 派送卸货 / 揽收装货 / 返回场站
        segmentDistance:
          type: number
          format: double
          description: 与上一站点间的分段里程（单位随 distanceUnit）
        segmentDuration:
          type: number
          format: double
          description: 与上一站点间的分段路网行驶秒数；仅 distanceUnit=km（路网路径）时给出，业务后端据此估算每站到达时刻，缺省时按直线÷均速兜底
    DistanceRequest:
      type: object
      required: [requestId, stations]
      properties:
        requestId:
          type: string
          description: 全局唯一请求标识，幂等键
        stations:
          type: array
          minItems: 2
          maxItems: 2
          description: 恰好两个站点，顺序为 [取货站, 送达站]，GCJ-02 坐标
          items:
            $ref: '#/components/schemas/DistancePoint'
    DistancePoint:
      type: object
      required: [stationId, longitude, latitude]
      properties:
        stationId:
          type: string
        longitude:
          type: number
          format: double
          description: GCJ-02 经度
        latitude:
          type: number
          format: double
          description: GCJ-02 纬度
    DistancePair:
      type: object
      required: [fromStationId, toStationId]
      properties:
        fromStationId:
          type: string
          description: 起点（取货站）站点标识
        toStationId:
          type: string
          description: 终点（送达站）站点标识
        distanceKm:
          type: number
          format: double
          description: 里程（恒为公里 km）；高德路网真实公里 / 直线估算 Haversine 公里，均不重复换算
        durationSeconds:
          type: number
          format: double
          description: 行驶秒数；高德路网真实秒，直线估算按均速换算的秒；不可达时省略
        provider:
          type: string
          enum: [amap, euclidean]
          description: 数据来源——amap=高德路网真实距离；euclidean=直线估算降级（高德失败/未配置 key）
        available:
          type: boolean
          default: true
          description: 是否可用——false 表示该点对明确不可达（高德无可行车道路），无 distanceKm/durationSeconds
    DistanceResponse:
      type: object
      required: [requestId, distanceUnit, pairs]
      properties:
        requestId:
          type: string
        distanceUnit:
          type: string
          enum: [km]
          description: 恒为 km（高德路网公里 / 直线估算 Haversine 公里），不做 degree 换算
        pairs:
          type: array
          description: 查询的站点对结果（本接口固定 1 对）
          items:
            $ref: '#/components/schemas/DistancePair'
        computedAt:
          type: string
          format: date-time
    RouteRequest:
      type: object
      required: [origin, destination]
      properties:
        origin:
          $ref: '#/components/schemas/RoutePoint'
        destination:
          $ref: '#/components/schemas/RoutePoint'
    RoutePoint:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: GCJ-02 纬度
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: GCJ-02 经度
    RouteResponse:
      type: object
      required: [available]
      properties:
        available:
          type: boolean
          description: 是否可用（false=明确不可达）
        distanceKm:
          type: number
          format: double
          description: 距离（恒为公里 km；高德真实 / 直线估算 Haversine）
        durationSeconds:
          type: number
          format: double
          description: 行驶秒数（高德真实秒 / 直线估算按均速换算秒）
        provider:
          type: string
          enum: [amap, euclidean]
          description: 数据来源
        reasonCode:
          type: string
          enum: [ROUTE_UNAVAILABLE]
          description: 不可用时原因码
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [INVALID_INPUT, OVER_LIMIT, INFEASIBLE, TIMEOUT, REQUEST_NOT_FOUND, NOT_READY, SERVICE_BUSY, ALGORITHM_INTERNAL_ERROR]
        message:
          type: string
        requestId:
          type: string
        details:
          type: object
          additionalProperties: true
