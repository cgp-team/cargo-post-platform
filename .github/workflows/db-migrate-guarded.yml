name: DB migrate (guarded, manual-only)

# ⚠ 这条流水线**只能由人手动触发**：没有 push、没有 schedule、没有 pull_request。
#   原因：`.github/workflows/deploy-dev.yml` 里那条 `Run database migration` 曾经每次 push master
#   无条件重放白名单脚本，把"往生产库加东西"挂在 push 上，等于"任何一次合并都可能改共享库"。
#   自 2026-10-16（队列 #69 / 台账 D-127）那一段默认不写库了（仓库变量 AUTO_DB_MIGRATE 不为 1 就跳过），
#   本文件因此是**唯一的写库入口**，并且默认只做只读探测：
#     mode=check  → 一个字都不写，只报告"这台库现在有没有这些列/表/菜单"
#     mode=apply  → 必须另外把 confirm 填成 APPLY 才会执行，且只跑幂等的脚本
#
# 只允许跑幂等脚本（重复执行不会报错、也不会二次伤害）：
#   sql/incremental/V028__wallet_tables.sql   —— 三段 CREATE TABLE IF NOT EXISTS
#   sql/incremental/V030__execution_writeback_guarded.sql —— 逐列 information_schema 守卫 + 末尾 3/3 自检
#   sql/incremental/V031__wallet_menu.sql / V032__pricing_rule_menu.sql —— 菜单行走
#       `INSERT … SELECT … WHERE NOT EXISTS (SELECT 1 FROM system_menu WHERE id = …)`，授权行走 INSERT IGNORE
#   sql/incremental/V033__station_pickup_attrs.sql —— 四列逐个查 information_schema 再 PREPARE/EXECUTE
#   sql/incremental/V034__handover_sign_url.sql / V035__pay_order_request_no.sql —— 同一守卫形态
#   sql/incremental/V036__pricing_rule_menu_free_ids.sql —— 计价规则页的补插（按 permission 判存在）
#   ⚠ 入选前逐条量过（本轮实测）：这些文件里 `裸 ALTER TABLE … ADD COLUMN` 出现 0 次、
#     守卫/NOT EXISTS 各就位 ⇒ 重复执行只会打印 "SELECT 1"，不会撞 ERROR 1060。
#   ⚠ **编号 035 被两个仓各自认领过一次**：上游用 `V035__pay_order_request_no.sql`（充值幂等键），
#     本轮原先叫 V035 的那支计价补插已挪到 **V036**（台账 D-133）。这不是重命名装饰：
#     "按号执行"的清单里同号不同文件 = 谁覆盖谁说不清，与 #70 那次菜单主键撞号同型。
# ⛔ 刻意**不跑** V029：它是裸 `ALTER TABLE ADD COLUMN`，第二次执行必然
#   ERROR 1060 Duplicate column name（本机 2026-10-12 实测）。V030 就是它的可重复形态。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check = 只探测不改库（默认）；apply = 真的执行迁移"
        required: true
        default: check
        type: choice
        options:
          - check
          - apply
      confirm:
        description: "mode=apply 时必须原样填 APPLY，否则直接终止"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: write  # 实测：只给 contents:read 时 upload-artifact 直接失败 ⇒ 读数取不回来

# 同一时刻只跑一条，排队不取消：两条并发往同一个库写会互相咬
concurrency:
  group: db-migrate-guarded
  cancel-in-progress: false

env:
  APP_DIR: /opt/cargo-post

jobs:
  migrate:
    # 与 deploy-dev.yml 同一台 self-hosted runner（构建与部署同机），因此这里连的就是那台机器上的 compose 网络
    runs-on: [self-hosted, cargo-post]
    steps:
      # ⚠ 这台 self-hosted runner 用 `actions/checkout` 是**碰运气**的：2026-10-17 连着两次
      #   （run 38993433484 / 38993831556）都红在 `Run actions/checkout@v7` 这一步，而同机同时间窗的
      #   `deploy-dev.yml` 一直是绿的 —— 差别不在网络"那一会儿好那一会儿坏"，在于 deploy-dev **根本不用**
      #   actions/checkout（它那一步叫 "Checkout (racing parallel tarball)"）；而 `ci.yml` 的 checkout 绿
      #   是因为它跑在 GitHub 托管 runner 上。上一轮把这件事记成"网络抖动"是不完整的归因（D-148），
      #   真正的判据是：**用不用 actions/checkout**，与 v4/v7 无关（两个版本都在这台机器上红过）。
      # 处置：主路仍走 actions/checkout（成功时最省事），失败时**落到 deploy-dev 那套已验证的竞速下载**，
      #   而不是让整支迁移作业因为"拿不到源码"而红 —— apply 的白名单与探针全在 `sql/` 里，读不到文件=什么都没判。
      - name: Checkout (actions/checkout，红则落到下面的竞速下载)
        id: co
        uses: actions/checkout@v7
        continue-on-error: true

      - name: "Checkout (fallback: racing parallel tarball —— 与 deploy-dev.yml 同一套)"
        if: steps.co.outcome != 'success'
        env:
          REPO: ${{ github.repository }}
          REF_SHA: ${{ github.sha }}
          CHECKOUT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "::warning title=checkout::actions/checkout 在这台 runner 上红了，落到竞速下载（服务器直连 github 每连接约 25KB/s 且随机被重置）"
          cd "$GITHUB_WORKSPACE"
          URL="https://api.github.com/repos/${REPO}/tarball/${REF_SHA}"
          WORK=$(mktemp -d /tmp/checkout-XXXXXX)
          trap 'rm -rf "${WORK}"' EXIT
          DEADLINE=$(( $(date +%s) + 1800 ))

          download_one() {
            local i=$1
            curl -sfL --connect-timeout 20 --speed-limit 1024 --speed-time 60 \
              -H "Authorization: token ${CHECKOUT_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -o "${WORK}/part${i}.tgz" "${URL}" \
              && gzip -t "${WORK}/part${i}.tgz" 2>/dev/null
          }

          winner=""
          round=0
          while [[ -z "${winner}" && $(date +%s) -lt ${DEADLINE} ]]; do
            round=$((round + 1))
            echo "=== race round ${round}: 8 streams ==="
            pids=""
            for i in $(seq 1 8); do
              ( download_one $i && touch "${WORK}/part${i}.ok" ) &
              pids="${pids} $!"
            done
            while [[ -z "${winner}" ]]; do
              winner=$(ls "${WORK}"/part*.ok 2>/dev/null | sed -n 1p || true)
              [[ -n "${winner}" ]] && break
              alive=0
              for p in ${pids}; do kill -0 "$p" 2>/dev/null && alive=$((alive+1)); done
              [[ ${alive} -eq 0 ]] && break
              [[ $(date +%s) -ge ${DEADLINE} ]] && break
              sleep 10
            done
            for p in ${pids}; do kill "$p" 2>/dev/null || true; done
            wait ${pids} 2>/dev/null || true
          done

          if [[ -z "${winner}" ]]; then
            echo "::error::30 分钟内没能完整下到 tarball ⇒ 这支迁移作业拿不到 sql/，不跑（不是"迁移失败"，是"没跑"）"
            exit 1
          fi

          tgz="${winner%.ok}.tgz"
          echo "winner: ${tgz} ($(stat -c%s "${tgz}") bytes), extracting..."
          find . -mindepth 1 -delete
          tar -xzf "${tgz}" --strip-components=1
          echo "Checkout (racing tarball) succeeded on round ${round}"

      - name: 守卫：默认只探测；apply 必须显式确认
        env:
          MODE: ${{ github.event.inputs.mode }}
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "${MODE}" = "check" ]; then
            echo "mode=check ⇒ 本次只读探测，不会执行任何写操作"
            exit 0
          fi
          if [ "${MODE}" != "apply" ]; then
            echo "::error::mode 只认 check / apply，收到的是 ${MODE}"
            exit 1
          fi
          if [ "${CONFIRM}" != "APPLY" ]; then
            echo "::error::apply 需要 confirm 原样填 APPLY（当前为空或不匹配），已终止：不写任何库"
            exit 1
          fi
          echo "mode=apply 且确认字面匹配 ⇒ 本次会执行幂等迁移脚本"

      - name: 探测当前库状态（只读，两种 mode 都跑）
        env:
          ENV_FILE: ${{ vars.ENV_FILE || '/opt/cargo-post-platform/.env' }}
        run: |
          set -Eeuo pipefail
          if [ ! -f "${ENV_FILE}" ]; then
            echo "::error::${ENV_FILE} 不存在：不知道要连哪台库，宁可失败也不猜"
            exit 1
          fi
          set -a; source "${ENV_FILE}"; set +a
          COMPOSE=(docker compose --env-file "${ENV_FILE}" -f deploy/docker-compose.yml)
          MYSQL_EXEC=("${COMPOSE[@]}" exec -T -e MYSQL_PWD="${DB_PASSWORD}" mysql mysql --default-character-set=utf8mb4 -u root)
          REPORT="${RUNNER_TEMP:-.}/db_state_report.txt"
          : > "${REPORT}"

          # 先把"要写到哪"打在读数上（只打库名与主机，不打密码）：
          # 手动作业最容易出的事故不是脚本错，而是人在错误的库上跑了正确的脚本
          echo "[目标库] $( "${MYSQL_EXEC[@]}" "${DB_NAME}" -N -B -e 'SELECT CONCAT(VERSION(), "  host=", @@hostname, "  db=", DATABASE())' )" | tee -a "${REPORT}"

          # probe 标签 期望 「只返回一个数字的 SQL」。
          # ⚠ 判定不在 SQL 里做：MySQL 的 IF() 只接受 3 个参数，而旧写法是
          #   IF(COUNT(*)=3,'已存在 3/3','缺失（当前 ', COUNT(*), '/3）' —— 5 个参数，
          #   那条查询本身就报 Incorrect parameter count ⇒ 整步红，
          #   红得像「库有问题」，实际是判据跑不动（本文件迄今唯一一次跑就是这样红的）。
          probe() {
            local label="$1" want="$2" sql="$3" out
            if out=$("${MYSQL_EXEC[@]}" "${DB_NAME}" -N -B -e "${sql}" 2>&1); then
              printf '%-28s 现=%-5s 期望=%s\n' "${label}" "${out}" "${want}" | tee -a "${REPORT}"
              echo "::notice title=DBSTATE::${label} 现=${out} 期望=${want}"
              ALL_READS="${ALL_READS}${label}=现${out}/期望${want}; "
            else
              printf '%-28s 查询本身失败：%s\n' "${label}" "$(printf '%s' "${out}" | tr '\n' ' ' | cut -c1-220)" | tee -a "${REPORT}"
              echo "::error title=DBSTATE::${label} 查询本身失败"
              ALL_READS="${ALL_READS}${label}=查询失败; "
              QUERY_ERRORS=$((QUERY_ERRORS + 1))
            fi
          }
          QUERY_ERRORS=0
          # 全部读数另外汇成**一条**注解发出去：这台 runner 每步只留前 10 条 `::notice`（GitHub 的硬上限），
          # 探针一多，排在后面的几十格在 API 里就读不到了 —— D-148 那次 apply 红了一格却三条诊断通道全断
          # （日志空 zip、artifact BlobNotFound、注解截到 10 条），只能靠推断交差。
          # 产物那条路在这台机器上依旧不通 ⇒ 汇总注解是目前唯一还能机器读的通道。
          ALL_READS=""
          emit_summary() { # 读数是给人看的，不该只活在一个传不上去的产物里
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              { echo "### 库结构读数（$(date -u +%FT%TZ)）"; echo '```'; cat "${REPORT}" 2>/dev/null; echo '```'; } >> "${GITHUB_STEP_SUMMARY}"
            fi
          }
          emit_summary
          echo "--- 现状探测（缺列不算失败：缺列就是要报的东西） ---" | tee -a "${REPORT}"
          probe "执行回流三列V029/V030" 3 "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND ((TABLE_NAME='transport_dispatch_plan_item' AND COLUMN_NAME IN ('actual_arrival_time','actual_finish_time')) OR (TABLE_NAME='transport_dispatch_plan' AND COLUMN_NAME='unassigned_orders'))"
          probe "钱包三表V028" 3 "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME IN ('transport_wallet_account','transport_wallet_transaction','transport_pay_order')"
          probe "揽收点四列V033" 4 "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='transport_station' AND COLUMN_NAME IN ('contact_name','contact_mobile','business_hours','ecommerce_flag')"
          probe "交接签名列V034" 1 "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='transport_handover' AND COLUMN_NAME='sign_url'"
          probe "充值幂等键列V035" 1 "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='transport_pay_order' AND COLUMN_NAME='request_no'"
          probe "充值幂等唯一键V035" 1 "SELECT COUNT(DISTINCT INDEX_NAME) FROM information_schema.STATISTICS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='transport_pay_order' AND INDEX_NAME='uk_pay_order_user_request'"
                    probe "菜单钱包查询(id=6920)" 1 "SELECT COUNT(*) FROM system_menu WHERE id = 6920"
                              probe "钱包查询按权限" 1 "SELECT COUNT(*) FROM system_menu WHERE permission='transport:wallet:query'"
                              probe "钱包查询角色授权" 1 "SELECT COUNT(*) FROM system_role_menu rm JOIN system_menu m ON m.id=rm.menu_id WHERE m.permission='transport:wallet:query' AND rm.role_id=1"
                    probe "计价规则两行按权限(V032/V036)" 2 "SELECT COUNT(*) FROM system_menu WHERE permission IN ('transport:pricing-rule:query','transport:pricing-rule:save') AND deleted = b'0'"
                    probe "菜单计价规则页(id=6940)" 1 "SELECT COUNT(*) FROM system_menu WHERE id = 6940 AND deleted = b'0'"
                    probe "菜单计价规则保存(id=6941)" 1 "SELECT COUNT(*) FROM system_menu WHERE id = 6941 AND deleted = b'0'"
                    probe "6930仍属货物交接" 1 "SELECT COUNT(*) FROM system_menu WHERE id = 6930 AND permission = 'transport:handover:query' AND deleted = b'0'"
          probe "表transport_town_event_calendarV037" 1 "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='transport_town_event_calendar'"
          probe "菜单事件日历按权限V037" 1 "SELECT COUNT(*) FROM system_menu WHERE permission='transport:town-event:query' AND deleted = b'0'"
          probe "菜单AI辅助任务按权限V055" 1 "SELECT COUNT(*) FROM system_menu WHERE permission='transport:ai:scenario:query' AND deleted = b'0'"
          probe "权限AI跑一次按权限V055" 1 "SELECT COUNT(*) FROM system_menu WHERE permission='transport:ai:task:run' AND deleted = b'0'"
          probe "AI辅助任务角色授权V055" 1 "SELECT COUNT(*) FROM system_role_menu rm JOIN system_menu m ON m.id=rm.menu_id WHERE m.permission='transport:ai:scenario:query' AND rm.role_id=1"
          probe "事件日历角色授权V037" 1 "SELECT COUNT(*) FROM system_role_menu rm JOIN system_menu m ON m.id=rm.menu_id WHERE m.permission='transport:town-event:query' AND rm.role_id=1"
          probe "菜单AI辅助目录(id=7100)V050" 1 "SELECT COUNT(*) FROM system_menu WHERE id = 7100 AND deleted = b'0'"
          probe "AI辅助目录角色授权V050" 1 "SELECT COUNT(*) FROM system_role_menu rm JOIN system_menu m ON m.id=rm.menu_id WHERE m.id=7100 AND rm.role_id=1"
          probe "表ai_saved_queryV052" 1 "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='ai_saved_query'"
          probe "菜单客货空间检视按权限V051" 1 "SELECT COUNT(*) FROM system_menu WHERE permission='transport:ai:capacity-conflict:query' AND deleted = b'0'"
          probe "菜单查询构造器按权限V052" 1 "SELECT COUNT(*) FROM system_menu WHERE permission='transport:ai:saved-query:query' AND deleted = b'0'"
          probe "查询构造器角色授权V052" 1 "SELECT COUNT(*) FROM system_role_menu rm JOIN system_menu m ON m.id=rm.menu_id WHERE m.permission='transport:ai:saved-query:query' AND rm.role_id=1"
          probe "表ai_invocation_logV054" 1 "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='ai_invocation_log'"
          probe "菜单能力状态按权限V053" 1 "SELECT COUNT(*) FROM system_menu WHERE permission='transport:ai:capability:query' AND deleted = b'0'"
          probe "能力状态角色授权V053" 1 "SELECT COUNT(*) FROM system_role_menu rm JOIN system_menu m ON m.id=rm.menu_id WHERE m.permission='transport:ai:capability:query' AND rm.role_id=1"
          probe "菜单调用日志按权限V054" 1 "SELECT COUNT(*) FROM system_menu WHERE permission='transport:ai:invocation-log:query' AND deleted = b'0'"
          probe "调用日志角色授权V054" 1 "SELECT COUNT(*) FROM system_role_menu rm JOIN system_menu m ON m.id=rm.menu_id WHERE m.permission='transport:ai:invocation-log:query' AND rm.role_id=1"
          probe "V030注释中文原样应为0" 0 "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='transport_dispatch_plan_item' AND COLUMN_NAME='actual_arrival_time' AND COLUMN_COMMENT NOT LIKE '%司机完成装车%'"
          probe "V033注释中文原样应为0" 0 "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='transport_station' AND COLUMN_NAME='contact_name' AND COLUMN_COMMENT NOT LIKE '%揽收点联系人%'"
          # V056 那两格在 check 模式也打印读数（只读诊断）：apply 之前应是 0/1，apply 之后才是 1/0
          probe "云管理员新号cargoadmin" 1 "SELECT COUNT(*) FROM system_users WHERE username='cargoadmin' AND deleted = b'0'"
          probe "云管理员旧号cargo_admin" 0 "SELECT COUNT(*) FROM system_users WHERE username='cargo_admin' AND deleted = b'0'"
          # V057 那五格在 check 模式也打印（只读诊断）：apply 之前应是 0/0/0/0/24
          # （最后那格 24 = 现在 `/transport` 下带组件的叶子数，按 sql/ 里的菜单树现数出来的），
          # apply 之后才是 7/7/27/11/8 —— 没有这条，点 apply 之前我对云上导航面是盲的
          probe "七个工作台叶V057" 7 "SELECT COUNT(*) FROM system_menu WHERE id BETWEEN 7160 AND 7166 AND deleted = b'0'"
          probe "超管拿到七个工作台V057" 7 "SELECT COUNT(DISTINCT menu_id) FROM system_role_menu WHERE role_id = 1 AND menu_id BETWEEN 7160 AND 7166 AND deleted = b'0'"
          probe "被折叠的27叶已收起V057" 27 "SELECT COUNT(*) FROM system_menu WHERE id IN (6811,6821,6831,6841,6845,6861,6914,6871,6935,6934,6878,6879,6851,6891,6881,6930,6910,6932,6901,6940,6950,6920,7110,7120,7130,7140,7150) AND visible = b'0' AND deleted = b'0'"
          probe "抽空的11目录已收起V057" 11 "SELECT COUNT(*) FROM system_menu WHERE id IN (6810,6820,6830,6840,6850,6860,6870,6877,6880,6890,6900) AND visible = b'0' AND deleted = b'0'"
          probe "侧栏可见transport叶V057" 8 "SELECT COUNT(*) FROM system_menu WHERE parent_id = 6800 AND type = 2 AND visible = b'1' AND deleted = b'0'"
          echo "[小结] 查询本身失败 ${QUERY_ERRORS} 条" | tee -a "${REPORT}"
          # 读数交给后面独立的一步发：实测（run 38994651948）**每一步只留前 10 条注解** ——
          # 39 格探针发 39 条 notice，API 里只回来最早的 10 条；把汇总放在同一步的最后，它就是第 40 条，永远取不到。
          # 独立成步之后它是那一步的第 1 条注解，必然在册。
          printf '%s' "${ALL_READS}" > "${RUNNER_TEMP:-.}/all_reads_probe.txt" 2>/dev/null || true
          emit_summary
          [ "${QUERY_ERRORS}" = 0 ] || { echo "::error::${QUERY_ERRORS} 条探测查询本身失败 ⇒ 这段判据跑不动，不许把'跑不了'读成'库是好的'"; exit 1; }

      - name: 执行幂等迁移（仅 mode=apply）
        if: ${{ github.event.inputs.mode == 'apply' }}
        env:
          ENV_FILE: ${{ vars.ENV_FILE || '/opt/cargo-post-platform/.env' }}
        run: |
          set -Eeuo pipefail
          set -a; source "${ENV_FILE}"; set +a
          COMPOSE=(docker compose --env-file "${ENV_FILE}" -f deploy/docker-compose.yml)
          MYSQL_EXEC=("${COMPOSE[@]}" exec -T -e MYSQL_PWD="${DB_PASSWORD}" mysql mysql --default-character-set=utf8mb4 -u root)

          # 失败自动诊断（沿用 deploy-dev.yml 的做法）：保留原始 exit code，不打印密码
          trap 'rc=$?; echo; echo "===== [失败诊断] exit ${rc} =====";
            "${COMPOSE[@]}" ps mysql 2>&1 || true;
            "${COMPOSE[@]}" logs --tail 100 mysql 2>&1 | tail -100 || true;
            echo "===== 诊断结束 ====="; exit ${rc};' ERR

          # V032 给全新库（主键 6940/6941），V036 给"已经跑过旧版 V032、那一页因为撞号从来没插进去"的库
          # （台账 D-127）。两条都按 permission 判存在 ⇒ 反复执行安全；V036 原先叫 V035，
          # 与上游的 V035__pay_order_request_no.sql 同号，本轮挪号（D-133）。
          for f in sql/incremental/V028__wallet_tables.sql sql/incremental/V030__execution_writeback_guarded.sql \
                   sql/incremental/V031__wallet_menu.sql sql/incremental/V032__pricing_rule_menu.sql \
                   sql/incremental/V033__station_pickup_attrs.sql sql/incremental/V034__handover_sign_url.sql \
                   sql/incremental/V035__pay_order_request_no.sql \
                   sql/incremental/V036__pricing_rule_menu_free_ids.sql \
                   sql/incremental/V037__town_event_calendar.sql \
                   sql/incremental/V050__ai_menu_dir.sql \
                   sql/incremental/V051__ai_capacity_conflict_menu.sql \
                   sql/incremental/V052__ai_saved_query.sql \
                   sql/incremental/V053__ai_capability_menu.sql \
                   sql/incremental/V054__ai_invocation_log.sql                    sql/incremental/V055__ai_task_menu.sql \
                   sql/incremental/V056__cloud_admin_username_alnum.sql \
                   sql/incremental/V057__admin_workbench_menu.sql; do
            # 显式 utf8mb4：容器内 mysql CLI 默认 character_set_client=latin1，
            # 不指定会把 UTF-8 脚本按 latin1 误读，中文列注释双重编码入库（那种坏是静默的）
            echo "Applying ${f} ..."
            # 逐支留凭证：作业绿不够 —— "各支都执行成功了"这句必须由每支自己的退出码与原文支撑（15 = 上面 for 循环里的实数）
            # ⚠ 13 → 14 这一格是**本轮补的漏**：V037（乡镇事件日历）进仓时我只把它写进了迁移目录，
            #   没加进这份白名单 ⇒ 就算有人按下 apply，云上也不会有那张表，而后台那个页面一打开就是 500。
            #   "脚本在仓库里"不等于"脚本会被执行"——这条流水线的白名单就是它唯一的执行面。
            #   入选前按同一口径量过：裸 ALTER 0 次、CREATE TABLE IF NOT EXISTS 2 次、菜单按 permission 判存在 3 次、INSERT IGNORE 2 次。
            errfile="${RUNNER_TEMP:-.}/apply_err.txt"
            if "${MYSQL_EXEC[@]}" "${DB_NAME}" < "${f}" 2>"${errfile}"; then
              echo "::notice title=APPLY::${f##*/} rc=0 原文=$(head -c 150 "${errfile}" 2>/dev/null | tr -d '\r\n') 后续 32 格读数见 DBSTATE 注解"
            else
              rc=$?
              echo "::error title=APPLY::${f##*/} rc=${rc} 原文=$(head -c 200 "${errfile}" 2>/dev/null | tr -d '\r\n')"
              exit "${rc}"
            fi
            echo "${f} done."
          done


      - name: 落地核对（仅 mode=apply）：数不出就必须红
        if: ${{ github.event.inputs.mode == 'apply' }}
        env:
          ENV_FILE: ${{ vars.ENV_FILE || '/opt/cargo-post-platform/.env' }}
        run: |
          set -Eeuo pipefail
          set -a; source "${ENV_FILE}"; set +a
          COMPOSE=(docker compose --env-file "${ENV_FILE}" -f deploy/docker-compose.yml)
          MYSQL_EXEC=("${COMPOSE[@]}" exec -T -e MYSQL_PWD="${DB_PASSWORD}" mysql mysql --default-character-set=utf8mb4 -u root)
          REPORT="${RUNNER_TEMP:-.}/db_state_report.txt"

          # 38 格 = 本步 probe_strict 的行数（不是"九格"那个旧账面：上游加了 V033/V034/V035 的
          # 六格、本轮把计价那两格换成"按权限 2 + 6940 + 6941 + 6930 归属"四格，再补 V053/V054 的
          # 5 格、去掉事件日历 3 格换 7100 目录 2 格；V056 加 2 格（云管理员新号/旧号）、
          # V057 加 5 格（七个工作台叶、27 个收起的叶、11 个抽空目录、侧栏可见叶 8、超管授权 7）；
          # 2026-10-17 apply 实测（run 38996520420）之后**去掉 1 格**：`cargoadmin=1` 挪出必数集合。
          # 不是改松凑绿 —— 同轮两格读数把根因钉死了：`cargo_admin` 与 `cargoadmin` **都是 0**，
          # 两个名字都不在这张库上，真因是 V001 从没在这张云库执行过（它不在 apply 白名单里）；
          # 而 V056 只做"把已存在的号改名"，它造不出一个本来就没有的号。那一格改由只读 check 步打印。
          # ⇒ 数要跟着实跑改，否则屏幕上念的格数和真正判的格数
          # 就是两个答案（台账 D-133）。第 16 本判据 `EXPECT_PROBES` 认的是同一个数。
          echo "--- 落地核对：apply 之后每一格都必须数满 ---" | tee -a "${REPORT}"
          MISSING=0
          probe_strict() {
            local label="$1" want="$2" sql="$3" out
            if out=$("${MYSQL_EXEC[@]}" "${DB_NAME}" -N -B -e "${sql}" 2>&1); then
              printf '%-28s 现=%-5s 期望=%s\n' "${label}" "${out}" "${want}" | tee -a "${REPORT}"
              echo "::notice title=DBSTATE::${label} 现=${out} 期望=${want}"
              ALL_READS="${ALL_READS}${label}=现${out}/期望${want}; "
              [ "${out}" = "${want}" ] || MISSING=$((MISSING + 1))
            else
              printf '%-28s 查询本身失败：%s\n' "${label}" "$(printf '%s' "${out}" | tr '\n' ' ' | cut -c1-220)" | tee -a "${REPORT}"
              echo "::error title=DBSTATE::${label} 查询本身失败"
              ALL_READS="${ALL_READS}${label}=查询失败; "
              MISSING=$((MISSING + 1))
            fi
          }
          # 同 check 步：每步注解上限 10 条 ⇒ 全部读数再汇成**一条**发出去（D-148 那条"看不见"的机器可读通道）
          ALL_READS=""
          probe_strict "执行回流三列V029/V030" 3 "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND ((TABLE_NAME='transport_dispatch_plan_item' AND COLUMN_NAME IN ('actual_arrival_time','actual_finish_time')) OR (TABLE_NAME='transport_dispatch_plan' AND COLUMN_NAME='unassigned_orders'))"
          probe_strict "钱包三表V028" 3 "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME IN ('transport_wallet_account','transport_wallet_transaction','transport_pay_order')"
          probe_strict "揽收点四列V033" 4 "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='transport_station' AND COLUMN_NAME IN ('contact_name','contact_mobile','business_hours','ecommerce_flag')"
          probe_strict "交接签名列V034" 1 "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='transport_handover' AND COLUMN_NAME='sign_url'"
          probe_strict "充值幂等键列V035" 1 "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='transport_pay_order' AND COLUMN_NAME='request_no'"
          probe_strict "充值幂等唯一键V035" 1 "SELECT COUNT(DISTINCT INDEX_NAME) FROM information_schema.STATISTICS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='transport_pay_order' AND INDEX_NAME='uk_pay_order_user_request'"
                    probe_strict "菜单钱包查询(id=6920)" 1 "SELECT COUNT(*) FROM system_menu WHERE id = 6920"
                              probe_strict "钱包查询按权限" 1 "SELECT COUNT(*) FROM system_menu WHERE permission='transport:wallet:query'"
                              probe_strict "钱包查询角色授权" 1 "SELECT COUNT(*) FROM system_role_menu rm JOIN system_menu m ON m.id=rm.menu_id WHERE m.permission='transport:wallet:query' AND rm.role_id=1"
                    probe_strict "计价规则两行按权限(V032/V036)" 2 "SELECT COUNT(*) FROM system_menu WHERE permission IN ('transport:pricing-rule:query','transport:pricing-rule:save') AND deleted = b'0'"
                    probe_strict "菜单计价规则页(id=6940)" 1 "SELECT COUNT(*) FROM system_menu WHERE id = 6940 AND deleted = b'0'"
                    probe_strict "菜单计价规则保存(id=6941)" 1 "SELECT COUNT(*) FROM system_menu WHERE id = 6941 AND deleted = b'0'"
                    probe_strict "6930仍属货物交接" 1 "SELECT COUNT(*) FROM system_menu WHERE id = 6930 AND permission = 'transport:handover:query' AND deleted = b'0'"
          probe_strict "表transport_town_event_calendarV037" 1 "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='transport_town_event_calendar'"
          probe_strict "菜单事件日历按权限V037" 1 "SELECT COUNT(*) FROM system_menu WHERE permission='transport:town-event:query' AND deleted = b'0'"
          probe_strict "菜单AI辅助任务按权限V055" 1 "SELECT COUNT(*) FROM system_menu WHERE permission='transport:ai:scenario:query' AND deleted = b'0'"
          probe_strict "权限AI跑一次按权限V055" 1 "SELECT COUNT(*) FROM system_menu WHERE permission='transport:ai:task:run' AND deleted = b'0'"
          probe_strict "AI辅助任务角色授权V055" 1 "SELECT COUNT(*) FROM system_role_menu rm JOIN system_menu m ON m.id=rm.menu_id WHERE m.permission='transport:ai:scenario:query' AND rm.role_id=1"
          probe_strict "事件日历角色授权V037" 1 "SELECT COUNT(*) FROM system_role_menu rm JOIN system_menu m ON m.id=rm.menu_id WHERE m.permission='transport:town-event:query' AND rm.role_id=1"
          probe_strict "菜单AI辅助目录(id=7100)V050" 1 "SELECT COUNT(*) FROM system_menu WHERE id = 7100 AND deleted = b'0'"
          probe_strict "AI辅助目录角色授权V050" 1 "SELECT COUNT(*) FROM system_role_menu rm JOIN system_menu m ON m.id=rm.menu_id WHERE m.id=7100 AND rm.role_id=1"
          probe_strict "表ai_saved_queryV052" 1 "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='ai_saved_query'"
          probe_strict "菜单客货空间检视按权限V051" 1 "SELECT COUNT(*) FROM system_menu WHERE permission='transport:ai:capacity-conflict:query' AND deleted = b'0'"
          probe_strict "菜单查询构造器按权限V052" 1 "SELECT COUNT(*) FROM system_menu WHERE permission='transport:ai:saved-query:query' AND deleted = b'0'"
          probe_strict "查询构造器角色授权V052" 1 "SELECT COUNT(*) FROM system_role_menu rm JOIN system_menu m ON m.id=rm.menu_id WHERE m.permission='transport:ai:saved-query:query' AND rm.role_id=1"
          probe_strict "表ai_invocation_logV054" 1 "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='ai_invocation_log'"
          probe_strict "菜单能力状态按权限V053" 1 "SELECT COUNT(*) FROM system_menu WHERE permission='transport:ai:capability:query' AND deleted = b'0'"
          probe_strict "能力状态角色授权V053" 1 "SELECT COUNT(*) FROM system_role_menu rm JOIN system_menu m ON m.id=rm.menu_id WHERE m.permission='transport:ai:capability:query' AND rm.role_id=1"
          probe_strict "菜单调用日志按权限V054" 1 "SELECT COUNT(*) FROM system_menu WHERE permission='transport:ai:invocation-log:query' AND deleted = b'0'"
          probe_strict "调用日志角色授权V054" 1 "SELECT COUNT(*) FROM system_role_menu rm JOIN system_menu m ON m.id=rm.menu_id WHERE m.permission='transport:ai:invocation-log:query' AND rm.role_id=1"
          probe_strict "V030注释中文原样应为0" 0 "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='transport_dispatch_plan_item' AND COLUMN_NAME='actual_arrival_time' AND COLUMN_COMMENT NOT LIKE '%司机完成装车%'"
          probe_strict "V033注释中文原样应为0" 0 "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='transport_station' AND COLUMN_NAME='contact_name' AND COLUMN_COMMENT NOT LIKE '%揽收点联系人%'"
          # V056：这一格判的是**真不变量** —— 库里不该有带下划线的管理员号（登录接口 `^[a-zA-Z0-9]{4,30}$`
          # 会在鉴权之前把它 400 掉，用户按文档那个号一次都登不进去）。改名语句本身就是为这条服务的。
          probe_strict "云管理员旧号已改名" 0 "SELECT COUNT(*) FROM system_users WHERE username='cargo_admin' AND deleted = b'0'"
          # ⚠ `cargoadmin` 那一格**从 apply 的必数集合里挪走了**，不是改松判据凑绿：
          #   2026-10-17 apply 实测（run 38996520420，39 格全量读数已能读回）里 V057 五格全数满，
          #   唯一红的是 `cargoadmin 现0/期望1` —— 同轮 `cargo_admin` 也读 0，两个名字都不在这张库上，
          #   真因是 `sql/cloud/V001__cloud_accounts_init.sql` 从没在这张库执行过（它不在 apply 白名单里），
          #   而 V056 是"把已存在的号改名"，它造不出一个本来就没有的号。
          #   ⇒ 那一格改到**只读 check 步打印**（见上面的 probe），apply 不再因为它判红；
          #     要不要在云上开这个号是人的决定（默认口令 + 公网），已写进 `docs/部署操作手册.md` 那段更正。
          # V057：导航集成。这五格判的是"合并只动了导航层，没动权限"这件事（队列 #104/#105）
          probe_strict "七个工作台叶V057" 7 "SELECT COUNT(*) FROM system_menu WHERE id BETWEEN 7160 AND 7166 AND deleted = b'0'"
          probe_strict "超管拿到七个工作台V057" 7 "SELECT COUNT(DISTINCT menu_id) FROM system_role_menu WHERE role_id = 1 AND menu_id BETWEEN 7160 AND 7166 AND deleted = b'0'"
          probe_strict "被折叠的27叶已收起V057" 27 "SELECT COUNT(*) FROM system_menu WHERE id IN (6811,6821,6831,6841,6845,6861,6914,6871,6935,6934,6878,6879,6851,6891,6881,6930,6910,6932,6901,6940,6950,6920,7110,7120,7130,7140,7150) AND visible = b'0' AND deleted = b'0'"
          probe_strict "抽空的11目录已收起V057" 11 "SELECT COUNT(*) FROM system_menu WHERE id IN (6810,6820,6830,6840,6850,6860,6870,6877,6880,6890,6900) AND visible = b'0' AND deleted = b'0'"
          probe_strict "侧栏可见transport叶V057" 8 "SELECT COUNT(*) FROM system_menu WHERE parent_id = 6800 AND type = 2 AND visible = b'1' AND deleted = b'0'"
          # 这条必须在"判红就 exit"之前**落盘**：红的时候才最需要读数（D-148 那次 apply 红了一格，
          # 而日志是空 zip、artifact BlobNotFound、逐格注解被每步 10 条上限截掉 ⇒ 哪一格红只能靠推断）。
          # 发注解交给后面独立的一步 —— 实测同一步里第 11 条起就不存了。
          printf '%s' "${ALL_READS}" > "${RUNNER_TEMP:-.}/all_reads_verify.txt" 2>/dev/null || true
          [ "${MISSING}" = 0 ] || { echo "::error::${MISSING} 格没数满：迁移没落到这张库上，别当已完成（send/stations 与 bus/nearby 还会回 500）"; exit 1; }
          echo "OK: 38 格全数满，注释按 utf8mb4 原样入库" | tee -a "${REPORT}"

      - name: "DBSTATE 汇总读数（独立一步：同一步只留前 10 条注解）"
        if: always()
        run: |
          # 每一步的注解上限是 10 条（实测 run 38994651948：39 格探针发了 39 条 notice，
          # check-runs/{id}/annotations 只回来最早那 10 条）。所以汇总必须**单独占一步**，
          # 它是那一步的第 1 条注解 ⇒ 一定取得到；`if: always()` 保证探针步红的时候也发。
          T="${RUNNER_TEMP:-.}"
          sent=0
          for f in all_reads_probe all_reads_verify; do
            p="${T}/${f}.txt"
            [ -f "${p}" ] || continue
            echo "::notice title=DBSTATE-ALL-${f}::$(tr -d '\r\n' < "${p}" | cut -c1-3600)"
            sent=$((sent + 1))
          done
          if [ "${sent}" = 0 ]; then
            echo "::warning title=DBSTATE-ALL::没有任何汇总文件 ⇒ 前面两个读数步都没跑到（不是「读数都对了」）"
          fi

      - name: 归档探测读数（无论成败都留凭证）
        if: always()
        continue-on-error: true  # 2026-10-14 实测：这台 runner 往 blob storage 传产物会 TLS 断，读数已在上面的步骤摘要与日志里
        uses: actions/upload-artifact@v4
        with:
          name: db-state-report
          path: ${{ runner.temp }}/db_state_report.txt
          if-no-files-found: warn
