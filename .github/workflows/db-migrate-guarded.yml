name: DB migrate (guarded, manual-only)

# ⚠ 这条流水线**只能由人手动触发**：没有 push、没有 schedule、没有 pull_request。
#   原因：`.github/workflows/deploy-dev.yml` 里那条 `Run database migration` 是每次 push master
#   无条件重放的，把"往生产库加东西"挂在 push 上，等于"任何一次合并都可能改共享库"。
#   本文件把同一件事收成一个显式动作，并且**默认只做只读探测**：
#     mode=check  → 一个字都不写，只报告"这台库现在有没有这些列/表"
#     mode=apply  → 必须另外把 confirm 填成 APPLY 才会执行，且只跑幂等的两支脚本
#
# 只允许跑幂等脚本（重复执行不会报错、也不会二次伤害）：
#   sql/incremental/V028__wallet_tables.sql   —— 三段 CREATE TABLE IF NOT EXISTS
#   sql/incremental/V030__execution_writeback_guarded.sql —— 逐列 information_schema 守卫 + 末尾 3/3 自检
#   sql/incremental/V031__wallet_menu.sql / V032__pricing_rule_menu.sql —— 菜单行走
#       `INSERT … SELECT … WHERE NOT EXISTS (SELECT 1 FROM system_menu WHERE id = …)`，授权行走 INSERT IGNORE
#   sql/incremental/V033__station_pickup_attrs.sql —— 四列逐个查 information_schema 再 PREPARE/EXECUTE
#   sql/incremental/V034__handover_sign_url.sql / V035__pay_order_request_no.sql —— 同一守卫形态
#   ⚠ 入选前逐条量过（本轮实测）：这五个文件里 `裸 ALTER TABLE … ADD COLUMN` 出现 0 次、
#     守卫/NOT EXISTS 各就位 ⇒ 重复执行只会打印 "SELECT 1"，不会撞 ERROR 1060。
# ⛔ 刻意**不跑** V029：它是裸 `ALTER TABLE ADD COLUMN`，第二次执行必然
#   ERROR 1060 Duplicate column name（本机 2026-10-12 实测）。V030 就是它的可重复形态。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check = 只探测不改库（默认）；apply = 真的执行迁移"
        required: true
        default: check
        type: choice
        options:
          - check
          - apply
      confirm:
        description: "mode=apply 时必须原样填 APPLY，否则直接终止"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: write  # 实测：只给 contents:read 时 upload-artifact 直接失败 ⇒ 读数取不回来

# 同一时刻只跑一条，排队不取消：两条并发往同一个库写会互相咬
concurrency:
  group: db-migrate-guarded
  cancel-in-progress: false

env:
  APP_DIR: /opt/cargo-post

jobs:
  migrate:
    # 与 deploy-dev.yml 同一台 self-hosted runner（构建与部署同机），因此这里连的就是那台机器上的 compose 网络
    runs-on: [self-hosted, cargo-post]
    steps:
      - uses: actions/checkout@v4

      - name: 守卫：默认只探测；apply 必须显式确认
        env:
          MODE: ${{ github.event.inputs.mode }}
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "${MODE}" = "check" ]; then
            echo "mode=check ⇒ 本次只读探测，不会执行任何写操作"
            exit 0
          fi
          if [ "${MODE}" != "apply" ]; then
            echo "::error::mode 只认 check / apply，收到的是 ${MODE}"
            exit 1
          fi
          if [ "${CONFIRM}" != "APPLY" ]; then
            echo "::error::apply 需要 confirm 原样填 APPLY（当前为空或不匹配），已终止：不写任何库"
            exit 1
          fi
          echo "mode=apply 且确认字面匹配 ⇒ 本次会执行幂等迁移脚本"

      - name: 探测当前库状态（只读，两种 mode 都跑）
        env:
          ENV_FILE: ${{ vars.ENV_FILE || '/opt/cargo-post-platform/.env' }}
        run: |
          set -Eeuo pipefail
          if [ ! -f "${ENV_FILE}" ]; then
            echo "::error::${ENV_FILE} 不存在：不知道要连哪台库，宁可失败也不猜"
            exit 1
          fi
          set -a; source "${ENV_FILE}"; set +a
          COMPOSE=(docker compose --env-file "${ENV_FILE}" -f deploy/docker-compose.yml)
          MYSQL_EXEC=("${COMPOSE[@]}" exec -T -e MYSQL_PWD="${DB_PASSWORD}" mysql mysql --default-character-set=utf8mb4 -u root)
          REPORT="${RUNNER_TEMP:-.}/db_state_report.txt"
          : > "${REPORT}"

          # 先把"要写到哪"打在读数上（只打库名与主机，不打密码）：
          # 手动作业最容易出的事故不是脚本错，而是人在错误的库上跑了正确的脚本
          echo "[目标库] $( "${MYSQL_EXEC[@]}" "${DB_NAME}" -N -B -e 'SELECT CONCAT(VERSION(), "  host=", @@hostname, "  db=", DATABASE())' )" | tee -a "${REPORT}"

          # probe 标签 期望 「只返回一个数字的 SQL」。
          # ⚠ 判定不在 SQL 里做：MySQL 的 IF() 只接受 3 个参数，而旧写法是
          #   IF(COUNT(*)=3,'已存在 3/3','缺失（当前 ', COUNT(*), '/3）' —— 5 个参数，
          #   那条查询本身就报 Incorrect parameter count ⇒ 整步红，
          #   红得像「库有问题」，实际是判据跑不动（本文件迄今唯一一次跑就是这样红的）。
          probe() {
            local label="$1" want="$2" sql="$3" out
            if out=$("${MYSQL_EXEC[@]}" "${DB_NAME}" -N -B -e "${sql}" 2>&1); then
              printf '%-28s 现=%-5s 期望=%s\n' "${label}" "${out}" "${want}" | tee -a "${REPORT}"
              echo "::notice title=DBSTATE::${label} 现=${out} 期望=${want}"
            else
              printf '%-28s 查询本身失败：%s\n' "${label}" "$(printf '%s' "${out}" | tr '\n' ' ' | cut -c1-220)" | tee -a "${REPORT}"
              echo "::error title=DBSTATE::${label} 查询本身失败"
              QUERY_ERRORS=$((QUERY_ERRORS + 1))
            fi
          }
          QUERY_ERRORS=0
          emit_summary() { # 读数是给人看的，不该只活在一个传不上去的产物里
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              { echo "### 库结构读数（$(date -u +%FT%TZ)）"; echo '```'; cat "${REPORT}" 2>/dev/null; echo '```'; } >> "${GITHUB_STEP_SUMMARY}"
            fi
          }
          emit_summary
          echo "--- 现状探测（缺列不算失败：缺列就是要报的东西） ---" | tee -a "${REPORT}"
          probe "执行回流三列V029/V030" 3 "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND ((TABLE_NAME='transport_dispatch_plan_item' AND COLUMN_NAME IN ('actual_arrival_time','actual_finish_time')) OR (TABLE_NAME='transport_dispatch_plan' AND COLUMN_NAME='unassigned_orders'))"
          probe "钱包三表V028" 3 "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME IN ('transport_wallet_account','transport_wallet_transaction','transport_pay_order')"
          probe "揽收点四列V033" 4 "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='transport_station' AND COLUMN_NAME IN ('contact_name','contact_mobile','business_hours','ecommerce_flag')"
          probe "交接签名列V034" 1 "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='transport_handover' AND COLUMN_NAME='sign_url'"
          probe "充值幂等键列V035" 1 "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='transport_pay_order' AND COLUMN_NAME='request_no'"
          probe "充值幂等唯一键V035" 1 "SELECT COUNT(DISTINCT INDEX_NAME) FROM information_schema.STATISTICS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='transport_pay_order' AND INDEX_NAME='uk_pay_order_user_request'"
                    probe "菜单钱包查询(id=6920)" 1 "SELECT COUNT(*) FROM system_menu WHERE id = 6920"
                              probe "钱包查询按权限" 1 "SELECT COUNT(*) FROM system_menu WHERE permission='transport:wallet:query'"
                              probe "钱包查询角色授权" 1 "SELECT COUNT(*) FROM system_role_menu rm JOIN system_menu m ON m.id=rm.menu_id WHERE m.permission='transport:wallet:query' AND rm.role_id=1"
                    probe "菜单计价规则页(id=6930)" 1 "SELECT COUNT(*) FROM system_menu WHERE id = 6930"
                    probe "菜单计价规则保存(id=6931)" 1 "SELECT COUNT(*) FROM system_menu WHERE id = 6931"
          probe "V030注释中文原样应为0" 0 "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='transport_dispatch_plan_item' AND COLUMN_NAME='actual_arrival_time' AND COLUMN_COMMENT NOT LIKE '%司机完成装车%'"
          probe "V033注释中文原样应为0" 0 "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='transport_station' AND COLUMN_NAME='contact_name' AND COLUMN_COMMENT NOT LIKE '%揽收点联系人%'"
          echo "[小结] 查询本身失败 ${QUERY_ERRORS} 条" | tee -a "${REPORT}"
          emit_summary
          [ "${QUERY_ERRORS}" = 0 ] || { echo "::error::${QUERY_ERRORS} 条探测查询本身失败 ⇒ 这段判据跑不动，不许把'跑不了'读成'库是好的'"; exit 1; }

      - name: 执行幂等迁移（仅 mode=apply）
        if: ${{ github.event.inputs.mode == 'apply' }}
        env:
          ENV_FILE: ${{ vars.ENV_FILE || '/opt/cargo-post-platform/.env' }}
        run: |
          set -Eeuo pipefail
          set -a; source "${ENV_FILE}"; set +a
          COMPOSE=(docker compose --env-file "${ENV_FILE}" -f deploy/docker-compose.yml)
          MYSQL_EXEC=("${COMPOSE[@]}" exec -T -e MYSQL_PWD="${DB_PASSWORD}" mysql mysql --default-character-set=utf8mb4 -u root)

          # 失败自动诊断（沿用 deploy-dev.yml 的做法）：保留原始 exit code，不打印密码
          trap 'rc=$?; echo; echo "===== [失败诊断] exit ${rc} =====";
            "${COMPOSE[@]}" ps mysql 2>&1 || true;
            "${COMPOSE[@]}" logs --tail 100 mysql 2>&1 | tail -100 || true;
            echo "===== 诊断结束 ====="; exit ${rc};' ERR

          for f in sql/incremental/V028__wallet_tables.sql sql/incremental/V030__execution_writeback_guarded.sql \
                   sql/incremental/V031__wallet_menu.sql sql/incremental/V032__pricing_rule_menu.sql \
                   sql/incremental/V033__station_pickup_attrs.sql sql/incremental/V034__handover_sign_url.sql \
                   sql/incremental/V035__pay_order_request_no.sql; do
            # 显式 utf8mb4：容器内 mysql CLI 默认 character_set_client=latin1，
            # 不指定会把 UTF-8 脚本按 latin1 误读，中文列注释双重编码入库（那种坏是静默的）
            echo "Applying ${f} ..."
            "${MYSQL_EXEC[@]}" "${DB_NAME}" < "${f}"
            echo "${f} done."
          done


      - name: 落地核对（仅 mode=apply）：数不出就必须红
        if: ${{ github.event.inputs.mode == 'apply' }}
        env:
          ENV_FILE: ${{ vars.ENV_FILE || '/opt/cargo-post-platform/.env' }}
        run: |
          set -Eeuo pipefail
          set -a; source "${ENV_FILE}"; set +a
          COMPOSE=(docker compose --env-file "${ENV_FILE}" -f deploy/docker-compose.yml)
          MYSQL_EXEC=("${COMPOSE[@]}" exec -T -e MYSQL_PWD="${DB_PASSWORD}" mysql mysql --default-character-set=utf8mb4 -u root)
          REPORT="${RUNNER_TEMP:-.}/db_state_report.txt"

          echo "--- 落地核对：apply 之后每一格都必须数满 ---" | tee -a "${REPORT}"
          MISSING=0
          probe_strict() {
            local label="$1" want="$2" sql="$3" out
            if out=$("${MYSQL_EXEC[@]}" "${DB_NAME}" -N -B -e "${sql}" 2>&1); then
              printf '%-28s 现=%-5s 期望=%s\n' "${label}" "${out}" "${want}" | tee -a "${REPORT}"
              echo "::notice title=DBSTATE::${label} 现=${out} 期望=${want}"
              [ "${out}" = "${want}" ] || MISSING=$((MISSING + 1))
            else
              printf '%-28s 查询本身失败：%s\n' "${label}" "$(printf '%s' "${out}" | tr '\n' ' ' | cut -c1-220)" | tee -a "${REPORT}"
              echo "::error title=DBSTATE::${label} 查询本身失败"
              MISSING=$((MISSING + 1))
            fi
          }
          probe_strict "执行回流三列V029/V030" 3 "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND ((TABLE_NAME='transport_dispatch_plan_item' AND COLUMN_NAME IN ('actual_arrival_time','actual_finish_time')) OR (TABLE_NAME='transport_dispatch_plan' AND COLUMN_NAME='unassigned_orders'))"
          probe_strict "钱包三表V028" 3 "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME IN ('transport_wallet_account','transport_wallet_transaction','transport_pay_order')"
          probe_strict "揽收点四列V033" 4 "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='transport_station' AND COLUMN_NAME IN ('contact_name','contact_mobile','business_hours','ecommerce_flag')"
          probe_strict "交接签名列V034" 1 "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='transport_handover' AND COLUMN_NAME='sign_url'"
          probe_strict "充值幂等键列V035" 1 "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='transport_pay_order' AND COLUMN_NAME='request_no'"
          probe_strict "充值幂等唯一键V035" 1 "SELECT COUNT(DISTINCT INDEX_NAME) FROM information_schema.STATISTICS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='transport_pay_order' AND INDEX_NAME='uk_pay_order_user_request'"
                    probe_strict "菜单钱包查询(id=6920)" 1 "SELECT COUNT(*) FROM system_menu WHERE id = 6920"
                              probe_strict "钱包查询按权限" 1 "SELECT COUNT(*) FROM system_menu WHERE permission='transport:wallet:query'"
                              probe_strict "钱包查询角色授权" 1 "SELECT COUNT(*) FROM system_role_menu rm JOIN system_menu m ON m.id=rm.menu_id WHERE m.permission='transport:wallet:query' AND rm.role_id=1"
                    probe_strict "菜单计价规则页(id=6930)" 1 "SELECT COUNT(*) FROM system_menu WHERE id = 6930"
                    probe_strict "菜单计价规则保存(id=6931)" 1 "SELECT COUNT(*) FROM system_menu WHERE id = 6931"
          probe_strict "V030注释中文原样应为0" 0 "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='transport_dispatch_plan_item' AND COLUMN_NAME='actual_arrival_time' AND COLUMN_COMMENT NOT LIKE '%司机完成装车%'"
          probe_strict "V033注释中文原样应为0" 0 "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='transport_station' AND COLUMN_NAME='contact_name' AND COLUMN_COMMENT NOT LIKE '%揽收点联系人%'"
          [ "${MISSING}" = 0 ] || { echo "::error::${MISSING} 格没数满：迁移没落到这张库上，别当已完成（send/stations 与 bus/nearby 还会回 500）"; exit 1; }
          echo "OK: 九格全数满，注释按 utf8mb4 原样入库" | tee -a "${REPORT}"

      - name: 归档探测读数（无论成败都留凭证）
        if: always()
        continue-on-error: true  # 2026-10-14 实测：这台 runner 往 blob storage 传产物会 TLS 断，读数已在上面的步骤摘要与日志里
        uses: actions/upload-artifact@v4
        with:
          name: db-state-report
          path: ${{ runner.temp }}/db_state_report.txt
          if-no-files-found: warn
