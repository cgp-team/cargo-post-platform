name: Deploy to dev server

on:
  workflow_dispatch:
  push:
    # 目前仓库只有 master；启用 develop 分支后在此追加
    branches: [master]

permissions:
  contents: read

# 同一时刻只允许一个部署，排队执行不取消，避免部署打架
concurrency:
  group: deploy-dev-server
  cancel-in-progress: false

env:
  DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
  APP_DIR: /opt/cargo-post
  JAR_PATH: yudao-server/target/yudao-server.jar

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 测试已在 ci.yml 的 PR 门禁中执行，这里只打包
      - name: Package backend
        run: mvn -B -pl yudao-server -am clean package -DskipTests

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${DEPLOY_PORT}" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload jar
        run: scp -i ~/.ssh/deploy_key -P "${DEPLOY_PORT}" "${JAR_PATH}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${APP_DIR}/yudao-server.jar.new"

      - name: Restart service and verify health
        run: |
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" bash -s <<'EOF'
          set -euo pipefail
          cd /opt/cargo-post
          # 旧包保留为 .bak，出问题可手工回滚
          if [[ -f yudao-server.jar ]]; then
            cp -a yudao-server.jar yudao-server.jar.bak
          fi
          mv yudao-server.jar.new yudao-server.jar
          sudo systemctl restart cargo-post
          for i in $(seq 1 40); do
            sleep 3
            if curl -fsS http://127.0.0.1:48080/actuator/health | grep -q '"status":"UP"'; then
              echo "Backend is UP after ${i} checks"
              exit 0
            fi
          done
          echo "Backend failed health check, recent status:" >&2
          systemctl status cargo-post -n 50 --no-pager >&2 || true
          exit 1
          EOF
