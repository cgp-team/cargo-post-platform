name: Deploy to dev server

on:
  workflow_dispatch:
  push:
    # 目前仓库只有 master；启用 develop 分支后在此追加
    branches: [master]
    # 纯文档/小程序/CI/mock 算法的改动不部署任何内容，直接跳过整条流水线
    paths-ignore:
      - 'docs/**'
      - 'miniprogram/**'
      - '.github/**'
      - 'mock-algorithm/**'

permissions:
  contents: read

# 同一时刻只允许一个部署，排队执行不取消，避免部署打架
concurrency:
  group: deploy-dev-server
  cancel-in-progress: false

env:
  APP_DIR: /opt/cargo-post
  JAR_PATH: yudao-server/target/yudao-server.jar
  JAVA_HOME: /usr/lib/jvm/java-21-openjdk-amd64

jobs:
  deploy:
    # self-hosted runner 运行在开发云服务器上（deploy 用户），构建与部署同机完成。
    # 托管 runner 跨境上传 jar 到国内服务器过慢（实测约 50KB/s），故放弃 SSH 上传方案。
    runs-on: [self-hosted, cargo-post]
    timeout-minutes: 60
    environment: dev
    steps:
      # 当前服务器网络现实：github 直连每连接仅 ~25KB/s 且随机被重置，代理订阅节点全灭；
      # codeload 不支持 Range（无法续传/分段），git 协议单流被重置即前功尽弃。
      # 改为「多路竞速下载 tarball」：8 条流各下全量包，gzip 校验完整即胜出，
      # 单流被重置不影响其他流；30 分钟预算内反复竞速。token 只走 curl 请求头，不落盘。
      - name: Checkout (racing parallel tarball)
        env:
          REPO: ${{ github.repository }}
          REF_SHA: ${{ github.sha }}
          CHECKOUT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          URL="https://api.github.com/repos/${REPO}/tarball/${REF_SHA}"
          WORK=$(mktemp -d /tmp/checkout-XXXXXX)
          trap 'rm -rf "${WORK}"' EXIT
          DEADLINE=$(( $(date +%s) + 1800 ))

          download_one() {
            local i=$1
            # --speed-limit/time：低于 1KB/s 持续 60s 判定流已死，及时杀掉让位下轮
            curl -sfL --connect-timeout 20 --speed-limit 1024 --speed-time 60 \
              -H "Authorization: token ${CHECKOUT_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -o "${WORK}/part${i}.tgz" "${URL}" \
              && gzip -t "${WORK}/part${i}.tgz" 2>/dev/null
          }

          winner=""
          round=0
          while [[ -z "${winner}" && $(date +%s) -lt ${DEADLINE} ]]; do
            round=$((round + 1))
            echo "=== race round ${round}: 8 streams ==="
            pids=""
            for i in $(seq 1 8); do
              ( download_one $i && touch "${WORK}/part${i}.ok" ) &
              pids="${pids} $!"
            done
            while [[ -z "${winner}" ]]; do
              winner=$(ls "${WORK}"/part*.ok 2>/dev/null | sed -n 1p || true)
              [[ -n "${winner}" ]] && break
              alive=0
              for p in ${pids}; do kill -0 "$p" 2>/dev/null && alive=$((alive+1)); done
              [[ ${alive} -eq 0 ]] && break
              [[ $(date +%s) -ge ${DEADLINE} ]] && break
              sleep 10
            done
            for p in ${pids}; do kill "$p" 2>/dev/null || true; done
            wait ${pids} 2>/dev/null || true
          done

          if [[ -z "${winner}" ]]; then
            echo "ERROR: 30 分钟内未能完整下载 tarball，github 直连过慢且代理不可用。" >&2
            exit 1
          fi

          tgz="${winner%.ok}.tgz"
          echo "winner: ${tgz} ($(stat -c%s "${tgz}") bytes), extracting..."
          find . -mindepth 1 -delete
          tar -xzf "${tgz}" --strip-components=1
          echo "Checkout (racing tarball) succeeded on round ${round}"

      # 变更范围探测：tarball 检出无 .git，走 compare API 拿文件清单。
      # 只部署有变更的部分（后端打包/前端构建/对应发布步骤按输出条件执行）。
      # 兜底：workflow_dispatch、API 失败、空清单 → 全量构建，宁多勿漏。
      - name: Detect changed areas
        id: changes
        env:
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          backend=true
          frontend=true
          algorithm=true
          if [[ -n "${BEFORE}" && "${BEFORE}" != "0000000000000000000000000000000000000000" ]]; then
            # 修正对比基准：若上次成功部署晚于 BEFORE（前序部署被取消、本次仅间隔文档 push），
            # 以"最近一次成功部署的 commit"为基准，避免被挤压的构建永远丢失（2026-08-23 实战踩坑）
            LAST_OK=$(curl -fsS --connect-timeout 20 --max-time 60 \
              -H "Authorization: token ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/actions/workflows/deploy-dev.yml/runs?branch=${{ github.ref_name }}&status=success&per_page=1" \
              | python3 -c 'import json,sys; r=json.load(sys.stdin).get("workflow_runs",[]); print(r[0]["head_sha"] if r else "")' || echo '')
            if [[ -n "${LAST_OK}" && "${LAST_OK}" != "${AFTER}" ]]; then
              echo "compare base overridden to last successful deploy: ${LAST_OK}"
              BEFORE="${LAST_OK}"
            fi
            RESP=$(curl -fsS --connect-timeout 20 --max-time 60 \
              -H "Authorization: token ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/compare/${BEFORE}...${AFTER}" || echo '')
            if [[ -n "${RESP}" ]]; then
              # 解析脚本以 base64 内嵌，规避 YAML 块标量缩进与引号转义问题
              echo '' | base64 -d > /tmp/parse_compare.py
              read -r backend frontend algorithm <<<"$(printf '%s' "${RESP}" | python3 /tmp/parse_compare.py)"
            fi
          fi
          echo "backend=${backend}" >> "${GITHUB_OUTPUT}"
          echo "frontend=${frontend}" >> "${GITHUB_OUTPUT}"
          echo "algorithm=${algorithm}" >> "${GITHUB_OUTPUT}"
          echo "changed areas: backend=${backend} frontend=${frontend} algorithm=${algorithm}"

      # 测试已在 ci.yml 的 PR 门禁中执行，这里只打包
      # 服务器本机 JDK 21 + Maven，依赖走 ~/.m2/settings.xml 的阿里云镜像
      # 离线优先（-o）+ 多核并行（-T 1C）；离线失败（如新增依赖未入本地仓库）回退在线
      - name: Package backend
        if: steps.changes.outputs.backend == 'true'
        run: |
          mvn -B -T 1C -o -pl yudao-server -am clean package -DskipTests || \
          mvn -B -T 1C -pl yudao-server -am clean package -DskipTests

      # Node 22 已预装在服务器 /usr/local（见 docs/deployment.md「服务器一次性配置」），
      # corepack 按 package.json 的 packageManager 字段自动对齐 pnpm 版本
      - name: Build frontend
        if: steps.changes.outputs.frontend == 'true'
        working-directory: yudao-ui/yudao-ui-admin-vue3
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build:prod

      - name: Run database migration
        run: |
          set -Eeuo pipefail

          # .env 不提交仓库，且 runner 工作区每次 checkout 都会清理，无法存放。
          # 从服务器持久检出的仓库根目录加载（见 docs/deployment.md「服务器一次性配置」），
          # 迁移用的 SQL 文件仍取自当前构建对应的工作区（与提交版本一致）。
          ENV_FILE="${ENV_FILE:-/opt/cargo-post-platform/.env}"
          if [ ! -f "${ENV_FILE}" ]; then
            echo "ERROR: ${ENV_FILE} not found. 请按 docs/deployment.md 在服务器持久检出根目录创建 .env（可参考 .env.example）" >&2
            exit 1
          fi
          set -a
          source "${ENV_FILE}"
          set +a

          COMPOSE=(docker compose --env-file "${ENV_FILE}" -f deploy/docker-compose.yml)
          MYSQL_EXEC=("${COMPOSE[@]}" exec -T mysql mysql --default-character-set=utf8mb4 -u root -p"${DB_PASSWORD}")

          # 失败自动诊断：输出 MySQL 容器状态/日志/表结构，保留原始 exit code，不打印密码
          trap 'rc=$?; echo; echo "===== [失败诊断] 数据库迁移失败（exit ${rc}） =====";
            echo "--- docker compose ps mysql ---"; "${COMPOSE[@]}" ps mysql 2>&1 || true;
            echo "--- mysql 容器日志 tail 200 ---"; "${COMPOSE[@]}" logs --tail=200 mysql 2>&1 | tail -200 || true;
            echo "--- mysqladmin ping ---"; "${COMPOSE[@]}" exec -T mysql mysqladmin ping -u root -p"${DB_PASSWORD}" --silent 2>&1 || true;
            echo "--- SHOW COLUMNS transport_dispatch_plan_item ---"; "${MYSQL_EXEC[@]}" "${DB_NAME}" -e "SHOW COLUMNS FROM transport_dispatch_plan_item" 2>&1 || true;
            echo "--- SHOW CREATE TABLE transport_dispatch_plan_item ---"; "${MYSQL_EXEC[@]}" "${DB_NAME}" -e "SHOW CREATE TABLE transport_dispatch_plan_item" 2>&1 || true;
            echo "--- SELECT DATABASE(), VERSION() ---"; "${MYSQL_EXEC[@]}" -e "SELECT DATABASE(), VERSION()" 2>&1 || true;
            echo "===== 诊断结束 ====="; exit ${rc};' ERR

          echo "MySQL ready check (DB: ${DB_NAME})..."
          mysql_ready=0
          for attempt in $(seq 1 10); do
            if "${COMPOSE[@]}" exec -T mysql mysqladmin ping -u root -p"${DB_PASSWORD}" --silent 2>/dev/null; then
              echo "MySQL is ready (attempt ${attempt})."
              mysql_ready=1
              break
            fi
            echo "MySQL not ready yet, retry ${attempt}/10 ..."
            sleep 3
          done
          if [[ "${mysql_ready}" -ne 1 ]]; then
            echo "ERROR: MySQL 容器不可达（10 次探测均失败）。" >&2
            exit 1
          fi

          for f in cleanup-upstream-menus transport-schema transport-schema-incremental transport-menu transport-demo-data; do
            if [ -f "sql/mysql/${f}.sql" ]; then
              echo "Applying ${f}.sql..."
              # 显式 utf8mb4：容器内 mysql CLI 默认 character_set_client=latin1，
              # 不显式指定会把 UTF-8 SQL 按 latin1 误读，中文双重编码入库
              "${MYSQL_EXEC[@]}" "${DB_NAME}" < "sql/mysql/${f}.sql"
              echo "${f}.sql done."
            fi
          done
          echo "All migrations applied."

      # 自研算法服务（algorithm/，OR-Tools）：代码更新时重建镜像并重启容器。
      # 后端默认仍指向 mock-algorithm(18080)；要真正启用需在服务器 /opt/cargo-post/app.env
      # 设 ALGORITHM_BASE_URL=http://127.0.0.1:18081 并重启 cargo-post（见 docs/deployment.md）。
      # 失败自动诊断：trap ERR 打印 docker/compose/端口/目录诊断，不裸 exit 1。
      - name: Build & deploy algorithm
        if: steps.changes.outputs.algorithm == 'true'
        run: |
          set -Eeuo pipefail
          ENV_FILE="${ENV_FILE:-/opt/cargo-post-platform/.env}"
          COMPOSE=(docker compose --env-file "${ENV_FILE}" -f deploy/docker-compose.yml)

          trap 'echo; echo "===== [失败诊断] Build & deploy algorithm 出错，打印诊断信息 =====";
            echo "--- uname ---"; uname -a 2>&1 || true;
            echo "--- 磁盘 df -h ---"; df -h 2>&1 | head -15 || true;
            echo "--- 内存 free -h ---"; free -h 2>&1 || true;
            echo "--- docker version ---"; docker version 2>&1 | head -25 || true;
            echo "--- docker compose version ---"; docker compose version 2>&1 || true;
            echo "--- docker info ---"; docker info 2>&1 | head -40 || true;
            echo "--- 端口 18081 监听(ss) ---"; ss -lntp 2>/dev/null | grep ":18081" || echo "(ss 未发现 18081 监听)";
            echo "--- 端口 18081 容器(docker ps) ---"; docker ps --format "{{.ID}} {{.Names}} {{.Ports}}" 2>/dev/null | grep "18081" || echo "(无容器占用 18081)";
            echo "--- algorithm 目录/Dockerfile ---"; ls -la algorithm/ 2>&1 | head -20 || true; test -f algorithm/Dockerfile && echo "Dockerfile 存在" || echo "Dockerfile 缺失";
            echo "--- compose config ---"; "${COMPOSE[@]}" config 2>&1 | head -60 || true;
            echo "--- 现有 cargo-post/algorithm 镜像 ---"; docker images cargo-post/algorithm 2>&1 || true;
            echo "--- 现有 algorithm 容器 ---"; "${COMPOSE[@]}" ps algorithm 2>&1 || true;
            echo "===== 诊断结束 =====";' ERR

          echo "===== [前置诊断] 环境 ====="
          uname -a || true
          df -h | head -10 || true
          free -h || true
          docker version || true
          docker compose version || true

          echo "===== [前置诊断] 目录与文件 ====="
          test -f algorithm/Dockerfile && echo "algorithm/Dockerfile 存在" || { echo "ERROR: algorithm/Dockerfile 缺失"; exit 1; }
          test -f algorithm/requirements.txt && echo "algorithm/requirements.txt 存在" || { echo "ERROR: algorithm/requirements.txt 缺失"; exit 1; }
          ls -la algorithm/ | head -20

          echo "===== [前置诊断] 端口 18081 ====="
          ss -lntp 2>/dev/null | grep ':18081' || echo "18081 未被监听"
          docker ps --format '{{.ID}} {{.Names}} {{.Ports}}' 2>/dev/null | grep '18081' || echo "无容器占用 18081"

          echo "===== [前置诊断] compose config 校验 ====="
          "${COMPOSE[@]}" config >/dev/null && echo "compose config 校验通过"

          echo "===== [前置诊断] 现有镜像/容器 ====="
          docker images cargo-post/algorithm || true
          "${COMPOSE[@]}" ps algorithm || true

          echo "===== 构建 algorithm 镜像（--progress=plain，最多 3 次重试） ====="
          for attempt in 1 2 3; do
            if "${COMPOSE[@]}" build --progress=plain algorithm; then
              echo "构建成功（第 ${attempt} 次尝试）"
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "ERROR: algorithm 镜像 3 次构建尝试均失败"
              exit 1
            fi
            echo "构建失败（第 ${attempt} 次），15 秒后重试..."
            sleep 15
          done

          echo "===== 启动 algorithm 容器 ====="
          "${COMPOSE[@]}" up -d algorithm

          echo "===== 验证部署结果 ====="
          "${COMPOSE[@]}" ps algorithm
          echo "algorithm 部署完成"

      - name: Deploy backend and restart
        if: steps.changes.outputs.backend == 'true'
        run: |
          set -euo pipefail
          cd "${APP_DIR}"
          # 旧包保留为 .bak，出问题可手工回滚
          if [[ -f yudao-server.jar ]]; then
            cp -a yudao-server.jar yudao-server.jar.bak
          fi
          cp "${GITHUB_WORKSPACE}/${JAR_PATH}" yudao-server.jar.new
          mv yudao-server.jar.new yudao-server.jar
          sudo /usr/bin/systemctl restart cargo-post

      - name: Deploy frontend
        if: steps.changes.outputs.frontend == 'true'
        run: |
          set -euo pipefail
          rsync -a --delete "${GITHUB_WORKSPACE}/yudao-ui/yudao-ui-admin-vue3/dist-prod/" /opt/cargo-post-web/

      - name: Health check
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            sleep 3
            HEALTH=$(curl -fsS --max-time 5 http://127.0.0.1:48080/actuator/health 2>/dev/null || echo '')
            if echo "$HEALTH" | grep -q '"status":"UP"'; then
              echo "Backend is UP after ${i} checks"
              break
            fi
            if [[ $i -eq 40 ]]; then
              echo "Backend failed health check, recent status:" >&2
              systemctl status cargo-post -n 50 --no-pager >&2 || true
              exit 1
            fi
          done
          echo "Checking frontend via nginx..."
          TMP_HTML=$(mktemp)
          if curl -fsS --max-time 10 http://127.0.0.1/ -o "$TMP_HTML" 2>/dev/null; then
            if grep -q "客货邮运营管理平台" "$TMP_HTML"; then
              echo "Frontend is served"
            else
              echo "Frontend check failed: expected text not found" >&2
              head -50 "$TMP_HTML" >&2 || true
              rm -f "$TMP_HTML"
              exit 1
            fi
          else
            echo "Failed to fetch frontend from nginx (curl exit $?)" >&2
            rm -f "$TMP_HTML"
            exit 1
          fi
          rm -f "$TMP_HTML"
