name: Deploy to dev server

on:
  workflow_dispatch:
  push:
    # 目前仓库只有 master；启用 develop 分支后在此追加
    branches: [master]

permissions:
  contents: read

# 同一时刻只允许一个部署，排队执行不取消，避免部署打架
concurrency:
  group: deploy-dev-server
  cancel-in-progress: false

env:
  APP_DIR: /opt/cargo-post
  JAR_PATH: yudao-server/target/yudao-server.jar
  JAVA_HOME: /usr/lib/jvm/java-21-openjdk-amd64

jobs:
  deploy:
    # self-hosted runner 运行在开发云服务器上（deploy 用户），构建与部署同机完成。
    # 托管 runner 跨境上传 jar 到国内服务器过慢（实测约 50KB/s），故放弃 SSH 上传方案。
    runs-on: [self-hosted, cargo-post]
    timeout-minutes: 45
    environment: dev
    steps:
      - uses: actions/checkout@v7

      # 测试已在 ci.yml 的 PR 门禁中执行，这里只打包
      # 服务器本机 JDK 21 + Maven，依赖走 ~/.m2/settings.xml 的阿里云镜像
      - name: Package backend
        run: mvn -B -pl yudao-server -am clean package -DskipTests

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # package.json 的 packageManager 字段锁定 pnpm 版本，corepack 自动生效
      - name: Build frontend
        working-directory: yudao-ui/yudao-ui-admin-vue3
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build:prod

      - name: Run database migration
        run: |
          set -euo pipefail
          # Create tables (safe: uses IF NOT EXISTS)
          if [ -f sql/mysql/transport-schema.sql ]; then
            mysql -u root -p"${DB_ROOT_PASSWORD:-123456}" ruoyi-vue-pro < sql/mysql/transport-schema.sql
            echo "Database migration (schema) applied."
          fi
          # Apply menu and permissions
          if [ -f sql/mysql/transport-menu.sql ]; then
            mysql -u root -p"${DB_ROOT_PASSWORD:-123456}" ruoyi-vue-pro < sql/mysql/transport-menu.sql
            echo "Database migration (menu) applied."
          fi
          # Insert demo data (uses INSERT IGNORE, safe to re-run)
          if [ -f sql/mysql/transport-demo-data.sql ]; then
            mysql -u root -p"${DB_ROOT_PASSWORD:-123456}" ruoyi-vue-pro < sql/mysql/transport-demo-data.sql
            echo "Database migration (demo data) applied."
          fi

      - name: Deploy backend and restart
        run: |
          set -euo pipefail
          cd "${APP_DIR}"
          # 旧包保留为 .bak，出问题可手工回滚
          if [[ -f yudao-server.jar ]]; then
            cp -a yudao-server.jar yudao-server.jar.bak
          fi
          cp "${GITHUB_WORKSPACE}/${JAR_PATH}" yudao-server.jar.new
          mv yudao-server.jar.new yudao-server.jar
          sudo /usr/bin/systemctl restart cargo-post

      - name: Deploy frontend
        run: |
          set -euo pipefail
          rsync -a --delete "${GITHUB_WORKSPACE}/yudao-ui/yudao-ui-admin-vue3/dist-prod/" /opt/cargo-post-web/

      - name: Health check
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            sleep 3
            if curl -fsS http://127.0.0.1:48080/actuator/health | grep -q '"status":"UP"'; then
              echo "Backend is UP after ${i} checks"
              break
            fi
            if [[ $i -eq 40 ]]; then
              echo "Backend failed health check, recent status:" >&2
              systemctl status cargo-post -n 50 --no-pager >&2 || true
              exit 1
            fi
          done
          echo "Checking frontend via nginx..."
          # 先落盘再 grep：grep -q 提前退出会让 curl 收到 SIGPIPE（exit 23），pipefail 下误判失败
          curl -fsS http://127.0.0.1/ -o /tmp/fe-index.html
          grep -q "客货邮运营管理平台" /tmp/fe-index.html && echo "Frontend is served"
