name: Deploy to dev server

on:
  workflow_dispatch:
  push:
    # master 为正式部署分支
    branches: [master]
    # 纯文档/CI 的改动不部署任何内容，直接跳过整条流水线（小程序已拆至 cargo-post-miniprogram 仓库，不在本仓库变更范围内）
    paths-ignore:
      - 'docs/**'
      - '.github/**'

permissions:
  contents: read

# 同一时刻只允许一个部署，排队执行不取消，避免部署打架
concurrency:
  group: deploy-dev-server
  cancel-in-progress: false

env:
  APP_DIR: /opt/cargo-post
  JAR_PATH: yudao-server/target/yudao-server.jar
  JAVA_HOME: /usr/lib/jvm/java-21-openjdk-amd64

jobs:
  deploy:
    # self-hosted runner 运行在开发云服务器上（deploy 用户），构建与部署同机完成。
    # 托管 runner 跨境上传 jar 到国内服务器过慢（实测约 50KB/s），故放弃 SSH 上传方案。
    runs-on: [self-hosted, cargo-post]
    timeout-minutes: 60
    environment: dev
    steps:
      # 当前服务器网络现实：github 直连每连接仅 ~25KB/s 且随机被重置，代理订阅节点全灭；
      # codeload 不支持 Range（无法续传/分段），git 协议单流被重置即前功尽弃。
      # 改为「多路竞速下载 tarball」：8 条流各下全量包，gzip 校验完整即胜出，
      # 单流被重置不影响其他流；30 分钟预算内反复竞速。token 只走 curl 请求头，不落盘。
      - name: Checkout (racing parallel tarball)
        env:
          REPO: ${{ github.repository }}
          REF_SHA: ${{ github.sha }}
          CHECKOUT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          URL="https://api.github.com/repos/${REPO}/tarball/${REF_SHA}"
          WORK=$(mktemp -d /tmp/checkout-XXXXXX)
          trap 'rm -rf "${WORK}"' EXIT
          DEADLINE=$(( $(date +%s) + 1800 ))

          download_one() {
            local i=$1
            # --speed-limit/time：低于 1KB/s 持续 60s 判定流已死，及时杀掉让位下轮
            curl -sfL --connect-timeout 20 --speed-limit 1024 --speed-time 60 \
              -H "Authorization: token ${CHECKOUT_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -o "${WORK}/part${i}.tgz" "${URL}" \
              && gzip -t "${WORK}/part${i}.tgz" 2>/dev/null
          }

          winner=""
          round=0
          while [[ -z "${winner}" && $(date +%s) -lt ${DEADLINE} ]]; do
            round=$((round + 1))
            echo "=== race round ${round}: 8 streams ==="
            pids=""
            for i in $(seq 1 8); do
              ( download_one $i && touch "${WORK}/part${i}.ok" ) &
              pids="${pids} $!"
            done
            while [[ -z "${winner}" ]]; do
              winner=$(ls "${WORK}"/part*.ok 2>/dev/null | sed -n 1p || true)
              [[ -n "${winner}" ]] && break
              alive=0
              for p in ${pids}; do kill -0 "$p" 2>/dev/null && alive=$((alive+1)); done
              [[ ${alive} -eq 0 ]] && break
              [[ $(date +%s) -ge ${DEADLINE} ]] && break
              sleep 10
            done
            for p in ${pids}; do kill "$p" 2>/dev/null || true; done
            wait ${pids} 2>/dev/null || true
          done

          if [[ -z "${winner}" ]]; then
            echo "ERROR: 30 分钟内未能完整下载 tarball，github 直连过慢且代理不可用。" >&2
            exit 1
          fi

          tgz="${winner%.ok}.tgz"
          echo "winner: ${tgz} ($(stat -c%s "${tgz}") bytes), extracting..."
          find . -mindepth 1 -delete
          tar -xzf "${tgz}" --strip-components=1
          echo "Checkout (racing tarball) succeeded on round ${round}"

      # 变更范围探测：tarball 检出无 .git，走 compare API 拿文件清单。
      # 只部署有变更的部分（后端打包/前端构建/对应发布步骤按输出条件执行）。
      # 兜底：workflow_dispatch、API 失败、空清单 → 全量构建，宁多勿漏。
      - name: Detect changed areas
        id: changes
        env:
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          backend=true
          frontend=true
          algorithm=true
          if [[ -n "${BEFORE}" && "${BEFORE}" != "0000000000000000000000000000000000000000" ]]; then
            # 修正对比基准：若上次成功部署晚于 BEFORE（前序部署被取消、本次仅间隔文档 push），
            # 以"最近一次成功部署的 commit"为基准，避免被挤压的构建永远丢失（2026-08-23 实战踩坑）
            LAST_OK=$(curl -fsS --connect-timeout 20 --max-time 60 \
              -H "Authorization: token ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/actions/workflows/deploy-dev.yml/runs?branch=${{ github.ref_name }}&status=success&per_page=1" \
              | python3 -c 'import json,sys; r=json.load(sys.stdin).get("workflow_runs",[]); print(r[0]["head_sha"] if r else "")' || echo '')
            if [[ -n "${LAST_OK}" && "${LAST_OK}" != "${AFTER}" ]]; then
              echo "compare base overridden to last successful deploy: ${LAST_OK}"
              BEFORE="${LAST_OK}"
            fi
            RESP=$(curl -fsS --connect-timeout 20 --max-time 60 \
              -H "Authorization: token ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/compare/${BEFORE}...${AFTER}" || echo '')
            if [[ -n "${RESP}" ]]; then
              # 解析脚本以 base64 内嵌，规避 YAML 块标量缩进与引号转义问题
              echo '' | base64 -d > /tmp/parse_compare.py
              read -r backend frontend algorithm <<<"$(printf '%s' "${RESP}" | python3 /tmp/parse_compare.py)"
            fi
          fi
          echo "backend=${backend}" >> "${GITHUB_OUTPUT}"
          echo "frontend=${frontend}" >> "${GITHUB_OUTPUT}"
          echo "algorithm=${algorithm}" >> "${GITHUB_OUTPUT}"
          echo "changed areas: backend=${backend} frontend=${frontend} algorithm=${algorithm}"

      # 测试已在 ci.yml 的 PR 门禁中执行，这里只打包
      # 服务器本机 JDK 21 + Maven，依赖走 ~/.m2/settings.xml 的阿里云镜像
      # 离线优先（-o）+ 多核并行（-T 1C）；离线失败（如新增依赖未入本地仓库）回退在线
      - name: Package backend
        if: steps.changes.outputs.backend == 'true'
        run: |
          mvn -B -T 1C -o -pl yudao-server -am clean package -DskipTests || \
          mvn -B -T 1C -pl yudao-server -am clean package -DskipTests

      # Node 22 已预装在服务器 /usr/local（见 docs/deployment.md「服务器一次性配置」），
      # corepack 按 package.json 的 packageManager 字段自动对齐 pnpm 版本
      - name: Build frontend
        if: steps.changes.outputs.frontend == 'true'
        working-directory: yudao-ui/yudao-ui-admin-vue3
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build:prod

      - name: Run database migration
        run: |
          set -Eeuo pipefail

          # .env 不提交仓库，且 runner 工作区每次 checkout 都会清理，无法存放。
          # 从服务器持久检出的仓库根目录加载（见 docs/deployment.md「服务器一次性配置」），
          # 迁移用的 SQL 文件仍取自当前构建对应的工作区（与提交版本一致）。
          ENV_FILE="${ENV_FILE:-/opt/cargo-post-platform/.env}"
          if [ ! -f "${ENV_FILE}" ]; then
            echo "ERROR: ${ENV_FILE} not found. 请按 docs/deployment.md 在服务器持久检出根目录创建 .env（可参考 .env.example）" >&2
            exit 1
          fi
          set -a
          source "${ENV_FILE}"
          set +a

          COMPOSE=(docker compose --env-file "${ENV_FILE}" -f deploy/docker-compose.yml)
          MYSQL_EXEC=("${COMPOSE[@]}" exec -T mysql mysql --default-character-set=utf8mb4 -u root -p"${DB_PASSWORD}")

          # 失败自动诊断：输出 MySQL 容器状态/日志/表结构，保留原始 exit code，不打印密码
          trap 'rc=$?; echo; echo "===== [失败诊断] 数据库迁移失败（exit ${rc}） =====";
            echo "--- docker compose ps mysql ---"; "${COMPOSE[@]}" ps mysql 2>&1 || true;
            echo "--- mysql 容器日志 tail 200 ---"; "${COMPOSE[@]}" logs --tail=200 mysql 2>&1 | tail -200 || true;
            echo "--- mysqladmin ping ---"; "${COMPOSE[@]}" exec -T mysql mysqladmin ping -u root -p"${DB_PASSWORD}" --silent 2>&1 || true;
            echo "--- SHOW COLUMNS transport_dispatch_plan_item ---"; "${MYSQL_EXEC[@]}" "${DB_NAME}" -e "SHOW COLUMNS FROM transport_dispatch_plan_item" 2>&1 || true;
            echo "--- SHOW CREATE TABLE transport_dispatch_plan_item ---"; "${MYSQL_EXEC[@]}" "${DB_NAME}" -e "SHOW CREATE TABLE transport_dispatch_plan_item" 2>&1 || true;
            echo "--- SELECT DATABASE(), VERSION() ---"; "${MYSQL_EXEC[@]}" -e "SELECT DATABASE(), VERSION()" 2>&1 || true;
            echo "===== 诊断结束 ====="; exit ${rc};' ERR

          echo "MySQL ready check (DB: ${DB_NAME})..."
          mysql_ready=0
          for attempt in $(seq 1 10); do
            if "${COMPOSE[@]}" exec -T mysql mysqladmin ping -u root -p"${DB_PASSWORD}" --silent 2>/dev/null; then
              echo "MySQL is ready (attempt ${attempt})."
              mysql_ready=1
              break
            fi
            echo "MySQL not ready yet, retry ${attempt}/10 ..."
            sleep 3
          done
          if [[ "${mysql_ready}" -ne 1 ]]; then
            echo "ERROR: MySQL 容器不可达（10 次探测均失败）。" >&2
            exit 1
          fi

          for f in cleanup-upstream-menus transport-schema transport-schema-incremental transport-menu; do
            if [ -f "sql/mysql/${f}.sql" ]; then
              echo "Applying ${f}.sql..."
              # 显式 utf8mb4：容器内 mysql CLI 默认 character_set_client=latin1，
              # 不显式指定会把 UTF-8 SQL 按 latin1 误读，中文双重编码入库
              "${MYSQL_EXEC[@]}" "${DB_NAME}" < "sql/mysql/${f}.sql"
              echo "${f}.sql done."
            fi
          done

          # 多段联运框架（V018）+ 站点可达性/方案/段/交接/通知扩展列（V019）
          # + 移除模拟运营表与菜单（V021）+ 会员中心菜单（V022）
          # 注意顺序：必须在 transport-schema 之后（新表、补列）
          for f in sql/incremental/V018__multi_leg_framework.sql sql/incremental/V019__station_access_and_plan_leg.sql \
                   sql/incremental/V021__remove_simulation.sql sql/incremental/V022__member_menu.sql; do
            if [ -f "${f}" ]; then
              echo "Applying ${f}..."
              "${MYSQL_EXEC[@]}" "${DB_NAME}" < "${f}"
              echo "${f} done."
            fi
          done

          # 多段联运菜单（货物交接 / 用户通知）
          for f in transport-multi-leg-menu; do
            if [ -f "sql/mysql/${f}.sql" ]; then
              echo "Applying ${f}.sql..."
              "${MYSQL_EXEC[@]}" "${DB_NAME}" < "sql/mysql/${f}.sql"
              echo "${f}.sql done."
            fi
          done
          echo "All migrations applied."

      - name: Validate schema drift columns
        run: |
          set -Eeuo pipefail
          ENV_FILE="${ENV_FILE:-/opt/cargo-post-platform/.env}"
          set -a; source "${ENV_FILE}"; set +a
          COMPOSE=(docker compose --env-file "${ENV_FILE}" -f deploy/docker-compose.yml)
          MYSQL_EXEC=("${COMPOSE[@]}" exec -T mysql mysql --default-character-set=utf8mb4 -u root -p"${DB_PASSWORD}")

          # 只读检查：所有 Java DO 使用的字段必须在生产表中存在。
          # 来源：transport-schema-incremental.sql 的 Schema drift repair 区块。
          MISSING=""
          CHECK_COL() {
            local tbl="$1" col="$2"
            local cnt
            cnt=$("${MYSQL_EXEC[@]}" "${DB_NAME}" -N -e \
              "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='${DB_NAME}' AND TABLE_NAME='${tbl}' AND COLUMN_NAME='${col}'")
            if [ "${cnt}" != "1" ]; then
              MISSING="${MISSING}  ${tbl}.${col}\n"
            fi
          }

          # transport_cargo_order (5)
          CHECK_COL transport_cargo_order review_status
          CHECK_COL transport_cargo_order review_reason_codes
          CHECK_COL transport_cargo_order pickup_service_mode
          CHECK_COL transport_cargo_order delivery_service_mode
          CHECK_COL transport_cargo_order service_point_station_id

          # transport_dispatch_plan (5)
          CHECK_COL transport_dispatch_plan est_duration_minutes
          CHECK_COL transport_dispatch_plan est_revenue
          CHECK_COL transport_dispatch_plan est_cost
          CHECK_COL transport_dispatch_plan task_window_start
          CHECK_COL transport_dispatch_plan task_window_end

          # transport_dispatch_plan_item (11)
          CHECK_COL transport_dispatch_plan_item segment_duration_seconds
          CHECK_COL transport_dispatch_plan_item segment_distance_km
          CHECK_COL transport_dispatch_plan_item planned_departure_time
          CHECK_COL transport_dispatch_plan_item service_duration_seconds
          CHECK_COL transport_dispatch_plan_item quantity
          CHECK_COL transport_dispatch_plan_item status
          CHECK_COL transport_dispatch_plan_item service_mode
          CHECK_COL transport_dispatch_plan_item service_point_station_id
          CHECK_COL transport_dispatch_plan_item detour_distance_km
          CHECK_COL transport_dispatch_plan_item detour_duration_seconds
          CHECK_COL transport_dispatch_plan_item reason_code

          # transport_vehicle (1)
          CHECK_COL transport_vehicle insurance_expire_date

          # ===== 多段联运 / 站点可达性 / 通知（V018 + V019）=====
          # transport_station (3)：用户可达 / 车辆可达 / 可调度
          CHECK_COL transport_station user_access
          CHECK_COL transport_station vehicle_access
          CHECK_COL transport_station dispatch_enabled
          # transport_vehicle (1)：实时运营状态
          CHECK_COL transport_vehicle realtime_status
          # transport_dispatch_plan (4)：方案组织方式/段数/换乘数/方案解释
          CHECK_COL transport_dispatch_plan planning_mode
          CHECK_COL transport_dispatch_plan total_leg_count
          CHECK_COL transport_dispatch_plan transfer_count
          CHECK_COL transport_dispatch_plan plan_reason
          # transport_leg (5)：方案归属 / 线路 / 里程时长 / 导航来源与轨迹 / 换乘标记
          CHECK_COL transport_leg plan_id
          CHECK_COL transport_leg navigation_source
          CHECK_COL transport_leg navigation_polyline
          CHECK_COL transport_leg handover_required
          CHECK_COL transport_leg distance_km
          # transport_handover (3)：双方车辆 / 状态机时间点
          CHECK_COL transport_handover plan_id
          CHECK_COL transport_handover from_vehicle_id
          CHECK_COL transport_handover handover_completed_at
          # transport_user_notification (3)：幂等 eventId / 接收方类型 / 级别
          CHECK_COL transport_user_notification event_id
          CHECK_COL transport_user_notification recipient_type
          CHECK_COL transport_user_notification level

          if [ -n "${MISSING}" ]; then
            echo "===== SCHEMA DRIFT DETECTED — missing columns ====="
            echo -e "${MISSING}"
            echo "Fix: ensure transport-schema-incremental.sql has ADD COLUMN for these."
            exit 1
          fi
          echo "Schema drift validation PASS: 上游 22 列 + 多段联运/可达性/通知 18 列 全部存在。"

      - name: Validate historical URL repair
        run: |
          set -Eeuo pipefail
          ENV_FILE="${ENV_FILE:-/opt/cargo-post-platform/.env}"
          set -a; source "${ENV_FILE}"; set +a
          COMPOSE=(docker compose --env-file "${ENV_FILE}" -f deploy/docker-compose.yml)
          MYSQL_EXEC=("${COMPOSE[@]}" exec -T mysql mysql --default-character-set=utf8mb4 -u root -p"${DB_PASSWORD}")

          # 只读检查：历史 URL 修复是否生效。
          FAIL=0

          # 1. 不应再存在 127.0.0.1:48080 URL
          CNT=$("${MYSQL_EXEC[@]}" "${DB_NAME}" -N -e \
            "SELECT COUNT(*) FROM infra_file WHERE url LIKE 'http://127.0.0.1:48080/%'")
          if [ "${CNT}" != "0" ]; then
            echo "FAIL: infra_file still has ${CNT} rows with 127.0.0.1:48080 URL"
            FAIL=1
          fi

          CNT=$("${MYSQL_EXEC[@]}" "${DB_NAME}" -N -e \
            "SELECT COUNT(*) FROM system_users WHERE avatar LIKE 'http://127.0.0.1:48080/%'")
          if [ "${CNT}" != "0" ]; then
            echo "FAIL: system_users still has ${CNT} rows with 127.0.0.1:48080 avatar"
            FAIL=1
          fi

          CNT=$("${MYSQL_EXEC[@]}" "${DB_NAME}" -N -e \
            "SELECT COUNT(*) FROM transport_cargo_order WHERE photo_url LIKE 'http://127.0.0.1:48080/%' OR driver_photo_url LIKE 'http://127.0.0.1:48080/%'")
          if [ "${CNT}" != "0" ]; then
            echo "FAIL: transport_cargo_order still has ${CNT} rows with 127.0.0.1:48080 URL"
            FAIL=1
          fi

          # 2. 不应再存在 example.com 测试 URL
          CNT=$("${MYSQL_EXEC[@]}" "${DB_NAME}" -N -e \
            "SELECT COUNT(*) FROM transport_cargo_order WHERE photo_url LIKE 'http://example.com/%' OR driver_photo_url LIKE 'http://example.com/%'")
          if [ "${CNT}" != "0" ]; then
            echo "FAIL: transport_cargo_order still has ${CNT} rows with example.com URL"
            FAIL=1
          fi

          # 3. 本机部署使用的文件配置必须带 /api 前缀：nginx 只把 /api/ 转发到后端（转发时剥前缀），
          #    缺前缀的 URL 会落到前端 SPA，浏览器拿到 index.html → 后台照片显示裂图。
          #    注意：只校验"指向本机服务器"的配置行；infra_file_config 里还有 5 条上游示例配置
          #    （七牛/腾讯/阿里/火山/华为，domain 为 test.yudao.iocoder.cn / null / 空），与本部署无关，不能一并判失败。
          CNT=$("${MYSQL_EXEC[@]}" "${DB_NAME}" -N -e \
            "SELECT COUNT(*) FROM infra_file_config WHERE JSON_EXTRACT(config,'\$.domain') LIKE 'http://1.15.29.107%' AND JSON_EXTRACT(config,'\$.domain') NOT LIKE '%/api'")
          if [ "${CNT}" != "0" ]; then
            echo "FAIL: 本机文件配置 domain 未带 /api 前缀（${CNT} 条）——图片 URL 会被 nginx 转发到前端"
            FAIL=1
          fi
          CNT=$("${MYSQL_EXEC[@]}" "${DB_NAME}" -N -e \
            "SELECT COUNT(*) FROM infra_file_config WHERE JSON_EXTRACT(config,'\$.domain') LIKE 'http://127.0.0.1%'")
          if [ "${CNT}" != "0" ]; then
            echo "FAIL: 仍有 ${CNT} 条文件配置指向 127.0.0.1，浏览器不可达"
            FAIL=1
          fi
          CNT=$("${MYSQL_EXEC[@]}" "${DB_NAME}" -N -e \
            "SELECT COUNT(*) FROM transport_cargo_order WHERE (photo_url LIKE 'http://1.15.29.107/%' AND photo_url NOT LIKE 'http://1.15.29.107/api/%') OR (driver_photo_url LIKE 'http://1.15.29.107/%' AND driver_photo_url NOT LIKE 'http://1.15.29.107/api/%')")
          if [ "${CNT}" != "0" ]; then
            echo "FAIL: transport_cargo_order 仍有 ${CNT} 条缺 /api 前缀的照片 URL"
            FAIL=1
          fi

          if [ "${FAIL}" = "1" ]; then
            echo "Historical URL validation FAILED."
            exit 1
          fi
          echo "Historical URL validation PASS: no legacy/test URLs found, file URLs carry /api prefix."

      # 自研算法服务（algorithm/，HACO-CPS）：代码更新时重建镜像并重启容器。
      # 后端接入已于 2026-08-30 切换到正式算法：服务器 /opt/cargo-post/config/application-dev.yaml
      # 的 yudao.transport.algorithm.base-url=http://127.0.0.1:18081（外部化 yaml 优先级高于 app.env 的
      # ALGORITHM_BASE_URL 占位符链路，两处均已指向 18081）。
      # 失败自动诊断：trap ERR 打印 docker/compose/端口/目录诊断，不裸 exit 1。
      - name: Build & deploy algorithm
        id: deploy_algorithm
        if: steps.changes.outputs.algorithm == 'true'
        run: |
          set -Eeuo pipefail
          # 注意：禁止 exec/tee 重定向，否则 self-hosted 实时 job 日志会被吞掉
          echo "===== algorithm deploy start $(date -Is) ====="
          ENV_FILE="${ENV_FILE:-/opt/cargo-post-platform/.env}"
          echo "ENV_FILE=${ENV_FILE}"
          echo "pwd=$(pwd)"
          ls -la algorithm/ | head -20
          echo "----- docker version -----"
          docker version 2>&1 | head -20
          echo "----- compose version -----"
          docker compose version 2>&1
          # --progress=plain 必须放在 build 子命令之前（Compose v2 全局参数）
          COMPOSE=(docker compose --progress=plain --env-file "${ENV_FILE}" -f deploy/docker-compose.yml)
          COMPOSE_NO_PROGRESS=(docker compose --env-file "${ENV_FILE}" -f deploy/docker-compose.yml)

          trap 'echo; echo "===== [失败诊断] Build & deploy algorithm 出错 =====";
            echo "--- exit code ---"; echo "退出码: $?";
            echo "--- uname ---"; uname -a 2>&1 || true;
            echo "--- 磁盘 df -h ---"; df -h 2>&1 | head -15 || true;
            echo "--- 内存 free -h ---"; free -h 2>&1 || true;
            echo "--- docker version ---"; docker version 2>&1 | head -25 || true;
            echo "--- docker compose version ---"; docker compose version 2>&1 || true;
            echo "--- docker buildx version ---"; docker buildx version 2>&1 || true;
            echo "--- docker info (builder) ---"; docker info 2>&1 | grep -A5 -i builder || true;
            echo "--- 端口 18081 监听(ss) ---"; ss -lntp 2>/dev/null | grep ":18081" || echo "(ss 未发现 18081 监听)";
            echo "--- 端口 18081 容器(docker ps) ---"; docker ps --format "{{.ID}} {{.Names}} {{.Ports}}" 2>/dev/null | grep "18081" || echo "(无容器占用 18081)";
            echo "--- algorithm 目录/Dockerfile ---"; ls -la algorithm/ 2>&1 | head -20 || true; test -f algorithm/Dockerfile && echo "Dockerfile 存在" || echo "Dockerfile 缺失";
            echo "--- compose config ---"; "${COMPOSE_NO_PROGRESS[@]}" config 2>&1 | head -60 || true;
            echo "--- 现有 cargo-post/algorithm 镜像 ---"; docker images cargo-post/algorithm 2>&1 || true;
            echo "--- 现有 algorithm 容器 ---"; "${COMPOSE_NO_PROGRESS[@]}" ps algorithm 2>&1 || true;
            echo "--- docker ps -a (最近) ---"; docker ps -a --format "{{.ID}} {{.Names}} {{.Status}}" 2>&1 | head -10 || true;
            echo "--- algorithm 容器日志 ---"; "${COMPOSE_NO_PROGRESS[@]}" logs --tail=50 algorithm 2>&1 || true;
            echo "===== 诊断结束 =====";' ERR

          echo "===== [前置诊断] 环境 ====="
          uname -a || true
          df -h | head -10 || true
          free -h || true
          docker version 2>&1 | head -20 || true
          docker compose version || true
          docker buildx version 2>&1 || true

          echo "===== [前置诊断] 目录与文件 ====="
          test -f algorithm/Dockerfile && echo "algorithm/Dockerfile 存在" || { echo "ERROR: algorithm/Dockerfile 缺失"; exit 1; }
          test -f algorithm/requirements.txt && echo "algorithm/requirements.txt 存在" || { echo "ERROR: algorithm/requirements.txt 缺失"; exit 1; }
          ls -la algorithm/ | head -20

          echo "===== [前置诊断] 端口 18081 ====="
          ss -lntp 2>/dev/null | grep ':18081' || echo "18081 未被监听"
          docker ps --format '{{.ID}} {{.Names}} {{.Ports}}' 2>/dev/null | grep '18081' || echo "无容器占用 18081"

          echo "===== [前置诊断] compose config 校验 ====="
          "${COMPOSE_NO_PROGRESS[@]}" config >/dev/null && echo "compose config 校验通过"

          echo "===== [前置诊断] 现有镜像/容器 ====="
          docker images cargo-post/algorithm 2>&1 || true
          "${COMPOSE_NO_PROGRESS[@]}" ps algorithm 2>&1 || true

          echo "===== 拉取 base 镜像 python:3.11-slim（多源兜底） ====="
          BASE_OK=0
          for src in \
            python:3.11-slim \
            docker.m.daocloud.io/library/python:3.11-slim \
            docker.1ms.run/library/python:3.11-slim \
            hub.rat.dev/library/python:3.11-slim
          do
            echo "--- docker pull ${src} ---"
            if docker pull "${src}"; then
              # 保证 Dockerfile 的 FROM python:3.11-slim 能命中本地
              if [ "${src}" != "python:3.11-slim" ]; then
                docker tag "${src}" python:3.11-slim
              fi
              BASE_OK=1
              echo "base 镜像就绪 via ${src}"
              break
            fi
            echo "pull 失败: ${src}"
          done
          if [ "${BASE_OK}" -ne 1 ]; then
            if docker image inspect cargo-post/algorithm:1.0.0 >/dev/null 2>&1; then
              echo "WARN: 所有源拉取 python:3.11-slim 失败，复用本机 cargo-post/algorithm:1.0.0 作为 build base"
              docker tag cargo-post/algorithm:1.0.0 python:3.11-slim
              BASE_OK=1
            else
              echo "ERROR: 无法获得 python:3.11-slim，且本机无 algorithm 镜像可复用"
              exit 1
            fi
          fi

          echo "===== 构建 algorithm 镜像（最多 3 次重试） ====="
          BUILD_RC=0
          for attempt in 1 2 3; do
            echo "--- 构建尝试 ${attempt}/3 $(date -Is) ---"
            echo "--- compose build algorithm 开始（--progress=plain） ---"
            "${COMPOSE[@]}" build algorithm && BUILD_RC=$? || BUILD_RC=$?
            echo "--- compose build algorithm 结束 rc=${BUILD_RC} ---"
            if [ "$BUILD_RC" -eq 0 ]; then
              echo "构建成功（第 ${attempt} 次尝试）"
              break
            fi
            echo "构建失败（第 ${attempt} 次，退出码 ${BUILD_RC}）"
            if [ "$attempt" -eq 3 ]; then
              echo "ERROR: algorithm 镜像 3 次构建尝试均失败（退出码 ${BUILD_RC}）"
              echo "--- 最后一次构建日志 ---"
              "${COMPOSE_NO_PROGRESS[@]}" logs --tail=100 algorithm 2>&1 || true
              exit 1
            fi
            echo "15 秒后重试..."
            sleep 15
          done

          echo "===== 启动 algorithm 容器 ====="
          "${COMPOSE_NO_PROGRESS[@]}" up -d algorithm

          # 宿主端口与 compose 的 ${ALGORITHM_PORT:-18081} 对齐，避免 .env 改端口后健康检查打错口
          ALGO_PORT="${ALGORITHM_PORT:-}"
          if [ -z "${ALGO_PORT}" ] && [ -f "${ENV_FILE}" ]; then
            ALGO_PORT="$(grep -E '^ALGORITHM_PORT=' "${ENV_FILE}" | tail -1 | cut -d= -f2- | tr -d '[:space:]' || true)"
          fi
          ALGO_PORT="${ALGO_PORT:-18081}"
          echo "algorithm host port: ${ALGO_PORT}"

          echo "===== 等待 algorithm 就绪（最多 60 秒） ====="
          READY=0
          for i in $(seq 1 20); do
            sleep 3
            if curl -fsS --max-time 3 "http://127.0.0.1:${ALGO_PORT}/health" >/dev/null 2>&1; then
              echo "algorithm 就绪（第 ${i} 次探测）"
              READY=1
              break
            fi
            echo "等待 algorithm 就绪... (${i}/20)"
          done

          if [ "$READY" -ne 1 ]; then
            echo "ERROR: algorithm 服务 60 秒内未就绪"
            echo "--- docker ps ---"
            docker ps -a --format "{{.ID}} {{.Names}} {{.Status}} {{.Ports}}" 2>&1 | head -10 || true
            echo "--- algorithm 容器状态 ---"
            "${COMPOSE_NO_PROGRESS[@]}" ps algorithm 2>&1 || true
            echo "--- algorithm 容器日志 ---"
            "${COMPOSE_NO_PROGRESS[@]}" logs --tail=200 algorithm 2>&1 || true
            exit 1
          fi

          echo "===== 验证部署结果 ====="
          "${COMPOSE_NO_PROGRESS[@]}" ps algorithm
          HEALTH=$(curl -fsS --max-time 5 "http://127.0.0.1:${ALGO_PORT}/health" 2>/dev/null || echo "unreachable")
          echo "algorithm health: ${HEALTH}"
          echo "algorithm 部署完成"

      # 后端 Redis 自愈：历史版本 jar 内 application-dev.yaml 曾默认指向上游公共演示 Redis，
      # 该类共享实例写命令被拒时（读命令正常，健康检查/监控看不出来），
      # 登录、短信验证码、商城下单、寄货提交等写 Redis 的链路会统一 500「系统异常」。
      # 本步骤先探测"当前后端能否写 Redis"，只有确认写失败、且服务器本机 Redis 容器读写自检通过时，
      # 才把 Redis 指向本机容器（幂等写 /opt/cargo-post/app.env）；任何一步不满足都只告警、不动配置。
      - name: Ensure backend has a writable Redis
        run: |
          set -Eeuo pipefail
          ENV_FILE="${ENV_FILE:-/opt/cargo-post-platform/.env}"
          APP_ENV="${APP_ENV:-/opt/cargo-post/app.env}"

          probe=$(curl -s --max-time 10 -X POST -H 'Content-Type: application/json' \
            -d '{"mobile":"13800000000","scene":1}' \
            http://127.0.0.1:48080/app-api/member/auth/send-sms-code || true)
          echo "current backend send-sms-code: ${probe}"
          if ! printf '%s' "${probe}" | grep -q '"code":500'; then
            echo "后端 Redis 写链路自检通过（非 500），保持现有 Redis 配置不变。"
            exit 0
          fi
          echo "检测到后端写 Redis 失败（send-sms-code 返回 500 系统异常），准备切到本机 Redis 容器。"

          if [ ! -f "${ENV_FILE}" ]; then
            echo "WARN: ${ENV_FILE} 不存在，无法确认本机 Redis 口令，跳过（配置未改动）"; exit 0
          fi
          set -a; source "${ENV_FILE}"; set +a
          if [ -z "${REDIS_PASSWORD:-}" ]; then
            echo "WARN: .env 缺少 REDIS_PASSWORD，跳过（配置未改动）"; exit 0
          fi
          if [ ! -w "${APP_ENV}" ] && [ ! -w "$(dirname "${APP_ENV}")" ]; then
            echo "WARN: ${APP_ENV} 不可写（非 deploy 属主），跳过（配置未改动）；请手工追加 SPRING_DATA_REDIS_* 后重启服务"; exit 0
          fi

          COMPOSE=(docker compose --env-file "${ENV_FILE}" -f deploy/docker-compose.yml)
          if ! "${COMPOSE[@]}" ps redis 2>/dev/null | grep -q redis; then
            echo "WARN: 本机 redis 容器未运行，跳过（配置未改动）"; exit 0
          fi
          if ! "${COMPOSE[@]}" exec -T redis redis-cli -a "${REDIS_PASSWORD}" --no-auth-warning set cargo-post:redis-probe ok | grep -q OK; then
            echo "WARN: 本机 Redis 写入自检失败，跳过（配置未改动）"; exit 0
          fi
          if ! "${COMPOSE[@]}" exec -T redis redis-cli -a "${REDIS_PASSWORD}" --no-auth-warning get cargo-post:redis-probe | grep -q ok; then
            echo "WARN: 本机 Redis 读回自检失败，跳过（配置未改动）"; exit 0
          fi

          APP_ENV_BAK="${APP_ENV}.before-redis-switch"
          touch "${APP_ENV}"
          cp -a "${APP_ENV}" "${APP_ENV_BAK}"
          for kv in "SPRING_DATA_REDIS_HOST=127.0.0.1" "SPRING_DATA_REDIS_PORT=${REDIS_PORT:-6379}" \
                    "SPRING_DATA_REDIS_DATABASE=1" "SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}"; do
            key="${kv%%=*}"
            sed -i "/^${key}=/d" "${APP_ENV}"
            echo "${kv}" >> "${APP_ENV}"
          done
          chmod 600 "${APP_ENV}" 2>/dev/null || true
          echo "已把后端 Redis 指向本机容器 127.0.0.1:${REDIS_PORT:-6379}（app.env 幂等更新，重启服务后生效）。"

          # 切换后立即重启并验证；起不来就回滚 app.env 再重启，避免把服务留在坏配置上。
          sudo /usr/bin/systemctl restart cargo-post
          REDIS_SWITCH_OK=0
          for i in $(seq 1 30); do
            sleep 3
            if curl -fsS --max-time 5 http://127.0.0.1:48080/actuator/health 2>/dev/null | grep -q '"status":"UP"'; then
              REDIS_SWITCH_OK=1; echo "Redis 切换后后端已恢复（第 ${i} 次探测）"; break
            fi
          done
          if [ "${REDIS_SWITCH_OK}" != "1" ]; then
            echo "ERROR: 切换本机 Redis 后后端未恢复，回滚 app.env 并重启。" >&2
            cp -a "${APP_ENV_BAK}" "${APP_ENV}"
            sudo /usr/bin/systemctl restart cargo-post
            systemctl status cargo-post -n 30 --no-pager >&2 || true
            exit 1
          fi

      # 高德 Web 服务 key 透传：仓库 .env 的 AMAP_KEY（算法容器同一把，用于路网距离）
      # 幂等写入后端 systemd env，让"附近公交现实站点层"与"算法路网距离/ETA"共用同一把 key。
      # 注意：必须是「Web 服务」类型 key；小程序类型 key 放后端会被高德拒绝（USERKEY_PLAT_NOMATCH）。
      - name: Sync AMAP_KEY to backend env
        run: |
          set -Eeuo pipefail
          ENV_FILE="${ENV_FILE:-/opt/cargo-post-platform/.env}"
          APP_ENV="${APP_ENV:-/opt/cargo-post/app.env}"
          if [ ! -f "${ENV_FILE}" ]; then
            echo "skip: ${ENV_FILE} 不存在"; exit 0
          fi
          set -a; source "${ENV_FILE}"; set +a
          if [ -z "${AMAP_KEY:-}" ]; then
            echo "AMAP_KEY 未配置：现实公交层走项目线路+模拟车辆，路网距离走直线估算（正常降级）"; exit 0
          fi
          if [ ! -w "${APP_ENV}" ] && [ ! -w "$(dirname "${APP_ENV}")" ]; then
            echo "WARN: ${APP_ENV} 不可写，跳过（可手工追加 AMAP_KEY=... 后重启服务）"; exit 0
          fi
          touch "${APP_ENV}"
          sed -i "/^AMAP_KEY=/d" "${APP_ENV}"
          echo "AMAP_KEY=${AMAP_KEY}" >> "${APP_ENV}"
          chmod 600 "${APP_ENV}" 2>/dev/null || true
          echo "已同步 AMAP_KEY 到后端 env（下次后端重启生效；若本次有后端变更会紧随其后重启）"

      # 两把高德 key 严格隔离：小程序 key（AMAP_MINI_KEY）只能在小程序端（已拆至 cargo-post-miniprogram 仓库），
      # 后端只允许 Web 服务 key（AMAP_KEY）。若误把小程序 key 写进后端 env，后端调用高德会全量失败。
      - name: "Guard - 小程序 key 不得进入后端 env"
        run: |
          set -Eeuo pipefail
          APP_ENV="${APP_ENV:-/opt/cargo-post/app.env}"
          MINI_CONFIG="${MINIPROGRAM_CONFIG:-/opt/cargo-post-miniprogram/utils/config.js}"
          if [ ! -f "${MINI_CONFIG}" ]; then
            echo "skip: ${MINI_CONFIG} 不存在（小程序在独立仓库 cargo-post-miniprogram；服务器有检出时可用 MINIPROGRAM_CONFIG 指定路径恢复校验）"; exit 0
          fi
          MINI_KEY_IN_MINI="$(grep -hoE "AMAP_MINI_KEY *= *'[^']+'" "${MINI_CONFIG}" 2>/dev/null | head -1 || true)"
          if [ -n "${MINI_KEY_IN_MINI}" ] && grep -qF "${MINI_KEY_IN_MINI}" "${APP_ENV}" 2>/dev/null; then
            echo "FAIL: 检测到小程序 key 被写进后端 env（${APP_ENV}）——两把 key 必须严格隔离" >&2
            exit 1
          fi
          echo "key 隔离校验通过：小程序 key 仅存在于 ${MINI_CONFIG}"

      - name: Deploy backend and restart
        if: steps.changes.outputs.backend == 'true'
        run: |
          set -euo pipefail
          cd "${APP_DIR}"
          # 旧包保留为 .bak，出问题可手工回滚
          if [[ -f yudao-server.jar ]]; then
            cp -a yudao-server.jar yudao-server.jar.bak
          fi
          cp "${GITHUB_WORKSPACE}/${JAR_PATH}" yudao-server.jar.new
          mv yudao-server.jar.new yudao-server.jar
          sudo /usr/bin/systemctl restart cargo-post

      - name: Deploy frontend
        if: steps.changes.outputs.frontend == 'true'
        run: |
          set -euo pipefail
          # DEP-01：发布前全量备份，健康检查失败自动回滚
          sudo rm -rf /opt/cargo-post-web.bak
          sudo cp -a /opt/cargo-post-web /opt/cargo-post-web.bak
          rsync -a --delete "${GITHUB_WORKSPACE}/yudao-ui/yudao-ui-admin-vue3/dist-prod/" /opt/cargo-post-web/

      - name: Health check
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            sleep 3
            HEALTH=$(curl -fsS --max-time 5 http://127.0.0.1:48080/actuator/health 2>/dev/null || echo '')
            if echo "$HEALTH" | grep -q '"status":"UP"'; then
              echo "Backend is UP after ${i} checks"
              break
            fi
            if [[ $i -eq 40 ]]; then
              echo "Backend failed health check, recent status:" >&2
              systemctl status cargo-post -n 50 --no-pager >&2 || true
              # DEP-01：自动回滚到上一版 jar 并重启；回滚成功与否都以非零退出终止发布
              if [[ -f "${APP_DIR}/yudao-server.jar.bak" ]]; then
                echo "Rolling back to previous jar..."
                cp -a "${APP_DIR}/yudao-server.jar.bak" "${APP_DIR}/yudao-server.jar"
                sudo /usr/bin/systemctl restart cargo-post
                sleep 10
                RB=$(curl -fsS --max-time 5 http://127.0.0.1:48080/actuator/health 2>/dev/null || echo '')
                if echo "$RB" | grep -q '"status":"UP"'; then
                  echo "Rollback succeeded, service restored to previous version." >&2
                else
                  echo "Rollback restart did not come UP either — manual intervention required!" >&2
                fi
              else
                echo "No .bak jar available, cannot auto-rollback." >&2
              fi
              exit 1
            fi
          done
          echo "Checking frontend via nginx..."
          TMP_HTML=$(mktemp)
          if curl -fsS --max-time 10 http://127.0.0.1/ -o "$TMP_HTML" 2>/dev/null; then
            if grep -q "客货邮运营管理平台" "$TMP_HTML"; then
              echo "Frontend is served"
            else
              echo "Frontend check failed: expected text not found" >&2
              head -50 "$TMP_HTML" >&2 || true
              rm -f "$TMP_HTML"
              # DEP-01：自动回滚前端备份
              if [[ -d /opt/cargo-post-web.bak ]]; then
                echo "Rolling back frontend..."
                sudo rsync -a --delete /opt/cargo-post-web.bak/ /opt/cargo-post-web/
                echo "Frontend rollback done."
              fi
              exit 1
            fi
          else
            echo "Failed to fetch frontend from nginx (curl exit $?)" >&2
            rm -f "$TMP_HTML"
            exit 1
          fi
          rm -f "$TMP_HTML"

      # DEP-05：watchdog 常驻化（幂等：CI 每次部署同步 timer，服务器上无需人工）
      - name: Ensure watchdog systemd timer
        if: steps.changes.outputs.backend == 'true' || steps.changes.outputs.frontend == 'true'
        run: |
          set -euo pipefail
          sudo cp -a "${GITHUB_WORKSPACE}/deploy/cargo-post-watchdog.timer" /etc/systemd/system/cargo-post-watchdog.timer
          sudo mkdir -p /opt/cargo-post-platform/scripts
          sudo cp -a "${GITHUB_WORKSPACE}/scripts/monitor_watchdog.py" /opt/cargo-post-platform/scripts/monitor_watchdog.py
          sudo systemctl daemon-reload
          sudo systemctl enable --now cargo-post-watchdog.timer
          systemctl is-active cargo-post-watchdog.timer
