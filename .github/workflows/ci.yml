name: Project validation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master, main, develop]

permissions:
  contents: read

jobs:
  # 变更范围探测：始终运行，输出各区域是否有变更，下游 job 按需跳过。
  # 这样 docs-only PR 也会产生（skipped 的）必需检查，配合 master 分支保护可正常合并。
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}
      algorithm: ${{ steps.detect.outputs.algorithm }}
      container: ${{ steps.detect.outputs.container }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect changed areas
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --depth=1 origin "${{ github.base_ref }}" >/dev/null 2>&1 || true
            RANGE="origin/${{ github.base_ref }}...HEAD"
          elif [[ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            RANGE="${{ github.event.before }}..${{ github.event.after }}"
          else
            RANGE="HEAD~1..HEAD"
          fi
          echo "diff range: ${RANGE}"
          CHANGED=$(git diff --name-only ${RANGE} || echo '')
          echo "${CHANGED}"
          has() { printf '%s\n' "${CHANGED}" | grep -qE "$1" && echo true || echo false; }
          # 后端：任意 java 模块、构建文件、SQL
          echo "backend=$(has '^(yudao-[^/]+/|pom\.xml|sql/)')" >> "${GITHUB_OUTPUT}"
          echo "frontend=$(has '^yudao-ui/')" >> "${GITHUB_OUTPUT}"
          # 自研算法：algorithm/ 目录下任意文件变更
          echo "algorithm=$(has '^algorithm/')" >> "${GITHUB_OUTPUT}"
          # 容器校验：compose/部署配置/算法镜像
          echo "container=$(has '^(deploy/|algorithm/|\.env\.example)')" >> "${GITHUB_OUTPUT}"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test active backend modules
        run: mvn -B -pl yudao-server -am clean test
      - name: Package backend
        run: mvn -B -pl yudao-server -am package -DskipTests

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yudao-ui/yudao-ui-admin-vue3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Detect complete Vue project
        id: frontend
        shell: bash
        run: |
          if [[ -f package.json && -f pnpm-lock.yaml ]]; then
            echo "ready=true" >>"${GITHUB_OUTPUT}"
          else
            echo "ready=false" >>"${GITHUB_OUTPUT}"
            echo "::warning::完整 Vue3 工程尚未接入；本次只校验 transport 接入骨架。"
          fi
      - name: Validate scaffold while frontend is pending
        if: steps.frontend.outputs.ready != 'true'
        run: test -f src/api/transport/index.ts && test -f src/views/transport/dashboard/index.vue
      - name: Enable lockfile package manager
        if: steps.frontend.outputs.ready == 'true'
        run: corepack enable
      - name: Install dependencies
        if: steps.frontend.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      # 先构建：unplugin-auto-import / unplugin-vue-components 在构建时生成
      # src/types/auto-*.d.ts，ts:check 依赖这些声明文件
      - name: Build
        if: steps.frontend.outputs.ready == 'true'
        run: pnpm build:prod
      - name: Type check
        if: steps.frontend.outputs.ready == 'true'
        run: pnpm ts:check

  # 自研算法（HACO-CPS）：快速必报检查（单元 + 契约 + 可复现性 + 消融，排除长时搜索基准）
  # 长时用例（打乱顺序 60/80 次、100 次确定性、多场景 benchmark）见下方 algorithm-verification，
  # 两个 job 并行执行：PR 反馈不再被 12 分钟的稳定性用例阻塞，覆盖不减少。
  algorithm:
    needs: changes
    if: needs.changes.outputs.algorithm == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: algorithm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: algorithm/requirements.txt
      - name: Install dependencies
        run: pip install --requirement requirements.txt
      # 一次跑完单元/契约/可复现性/消融（原 4 个步骤互相重复，已合并），并跳过 slow 标记的长时用例
      - name: Unit & contract tests (fast)
        run: python -m pytest tests/ -q -m "not slow" --ignore=tests/benchmarks --tb=short
      - name: Import application
        run: python -c "from app.main import app; assert app.title"

  # 长时验证（与 algorithm 并行）：slow 标记的稳定性/综合验证 + benchmark 套件。
  # 说明：这些用例跑满统计口径（打乱 60/80 次、100 次确定性、多场景基准），耗时约 10~13 分钟，
  # 因此独立成 job，避免拖住必需检查 algorithm；如需纳入合并门禁，把本 job 勾选为必需检查即可。
  algorithm-verification:
    needs: changes
    if: needs.changes.outputs.algorithm == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: algorithm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: algorithm/requirements.txt
      - name: Install dependencies
        run: pip install --requirement requirements.txt
      - name: Slow stability & comprehensive verification
        run: python -m pytest tests/ -q -m "slow" --tb=short
      - name: Benchmark suite
        run: python -m pytest tests/benchmarks -q --tb=short -x

  container-validation:
    needs: changes
    if: needs.changes.outputs.container == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare safe development environment
        run: cp .env.example .env
      - name: Validate Compose
        run: docker compose --env-file .env -f deploy/docker-compose.yml config --quiet
      - name: Build Algorithm image
        run: docker compose --env-file .env -f deploy/docker-compose.yml build algorithm
      - name: Smoke algorithm health
        run: |
          set -euo pipefail
          docker compose --env-file .env -f deploy/docker-compose.yml up -d algorithm
          for i in $(seq 1 20); do
            if curl -fsS --max-time 3 http://127.0.0.1:18081/health >/dev/null 2>&1; then
              echo "algorithm health ok (attempt ${i})"
              exit 0
            fi
            sleep 3
          done
          echo "ERROR: algorithm failed health within 60s" >&2
          docker compose --env-file .env -f deploy/docker-compose.yml logs --tail=100 algorithm || true
          docker compose --env-file .env -f deploy/docker-compose.yml ps algorithm || true
          exit 1

  # 始终运行：必需文件与生成物漂移检查（低成本），保证分支保护至少有一项必报检查
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Reject tracked local environment files
        shell: bash
        run: |
          # yudao-ui 前端工程的 .env* 是 Vite 构建配置（内容会打包进 JS，非密钥），按上游惯例纳入仓库
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$' | grep -vE '^yudao-ui/'; then
            echo "Tracked local environment file detected" >&2
            exit 1
          fi
      - name: Check required project files
        run: |
          test -f docs/requirements.md
          test -f docs/architecture.md
          test -f docs/api/algorithm-api.yaml
          test -f algorithm/app/main.py
          test -f deploy/docker-compose.yml
          test -f sql/mysql/transport-schema.sql
      - name: Check generated-file drift
        run: git diff --exit-code
