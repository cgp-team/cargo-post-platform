name: cargo-post-platform

services:
  mysql:
    image: mysql:8.4.5
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:?set DB_NAME}
      MYSQL_USER: ${DB_USER:?set DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306" # 仅本机：后端跑在宿主机，无需对公网开放
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--performance-schema=OFF"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7.4.5-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379" # 仅本机：后端跑在宿主机，无需对公网开放
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  # MinIO 已于 2026-08-19 停用：从未产生任何文件（0 对象），文件存储 master 已切回数据库存储。
  # 需要对象存储时取消注释本服务与下方 minio-data 卷即可恢复。
  # minio:
  #   image: minio/minio:RELEASE.2025-04-22T22-12-26Z
  #   restart: unless-stopped
  #   environment:
  #     MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
  #     MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
  #   ports:
  #     - "${MINIO_API_PORT:-9000}:9000"
  #     - "${MINIO_CONSOLE_PORT:-9001}:9001"
  #   command: ["server", "/data", "--console-address", ":9001"]
  #   volumes:
  #     - minio-data:/data
  #   healthcheck:
  #     test: ["CMD", "mc", "ready", "local"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 10

  # 自研路线规划算法服务（ortools-1.1.0）。
  # 业务后端已于 2026-08-30 切到本服务：application-dev.yaml base-url=http://127.0.0.1:18081（宿主端口）。
  algorithm:
    build:
      context: ../algorithm
      dockerfile: Dockerfile
    image: cargo-post/algorithm:1.0.0
    restart: unless-stopped
    environment:
      # 高德「距离测量」Web 服务 key：配置后切驾车路网距离（km），留空走欧氏直线（度）
      AMAP_KEY: ${AMAP_KEY:-}
    ports:
      - "127.0.0.1:${ALGORITHM_PORT:-18081}:8000" # 仅本机：只允许后端内网访问
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
  redis-data:
  # minio-data:  # MinIO 已停用，卷保留在服务器上未删除，恢复服务时取消注释
