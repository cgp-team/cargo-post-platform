# 客货邮运营管理平台管理端：静态托管 + /api、/ws 代理本机后端
#
# 本文件与生产服务器 /etc/nginx/sites-enabled/cargo-post 保持一致（2026-09-21 同步，
# 含 certbot --nginx 生成的 HTTPS 配置）。证书由 certbot 自动续期（certbot.timer）。
#
# 注意：服务器 mihomo 代理为 TUN 模式，已为其配置绕行规则（/etc/mihomo/config.yaml）：
#   fake-ip-filter 增加 "+.letsencrypt.org"，rules 顶部增加 DOMAIN-SUFFIX,letsencrypt.org,DIRECT
# 否则 certbot 签发/续期时访问 acme-v02.api.letsencrypt.org 的 TLS 会被代理掐断。

# IP 直连（开发版小程序/应急访问保留）
server {
    listen 80 default_server;
    server_name _;
    root /opt/cargo-post-web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 浏览器统一使用 /api/admin-api/...，转发时去掉 /api 前缀
    location /api/ {
        proxy_pass http://127.0.0.1:48080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:48080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}

# 域名 HTTPS 入口（管理端 + 小程序体验版/正式版共用）
server {
    server_name api.qwer2333.com;
    root /opt/cargo-post-web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:48080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:48080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.qwer2333.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.qwer2333.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# 域名 HTTP → HTTPS 跳转
server {
    if ($host = api.qwer2333.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name api.qwer2333.com;
    return 404; # managed by Certbot
}
