# 客货邮运营管理平台管理端：静态托管 + /api、/ws 代理本机后端
#
# 本文件与生产服务器 /etc/nginx/sites-enabled/cargo-post 保持一致（2026-09-21 同步，
# 含 certbot --nginx 生成的 HTTPS 配置）。证书由 certbot 自动续期（certbot.timer）。
#
# 注意：服务器 mihomo 代理为 TUN 模式，已为其配置绕行规则（/etc/mihomo/config.yaml）：
#   fake-ip-filter 增加 "+.letsencrypt.org"，rules 顶部增加 DOMAIN-SUFFIX,letsencrypt.org,DIRECT
# 否则 certbot 签发/续期时访问 acme-v02.api.letsencrypt.org 的 TLS 会被代理掐断。
#
# 2026-09-21 性能修复：主 nginx.conf 的 gzip_types 默认被注释（只压 text/html），
# 已开启 JS/CSS/JSON 压缩（主包 2.7MB→881KB）；本文件两个 server 块均含 /assets/ 长缓存。
#
# 2026-09-21 缓存修复：两个 server 块的 location / 增加 Cache-Control: no-cache，
# 防止浏览器启发式缓存 index.html 后在发布后引用已删除的旧 hash 资产（页面卡加载屏）。

# IP 直连（开发版小程序/应急访问保留）
server {
    listen 80 default_server;
    server_name _;
    root /opt/cargo-post-web;
    index index.html;

    # DEP-03：安全与代理基线（limit_req_zone 需 http 级上下文，须在 /etc/nginx/nginx.conf 配 zone 后
    # 在此引用：limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;  location /api/ 内 limit_req zone=perip burst=20 nodelay;）
    server_tokens off;
    client_max_body_size 20m;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 指纹静态资源长缓存（文件名带 hash，可安全 immutable）
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always; # DEP-03
        try_files $uri =404;
    }

    # index.html 等入口文件禁止启发式缓存：文件名不带 hash，必须每次回源校验，
    # 否则发布新版本后浏览器会用缓存的旧 index.html 引用已被 rsync --delete 删除的
    # 旧 hash 资产，页面永久卡在加载屏（2026-09-21 实战故障）
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always; # DEP-03
        add_header X-Frame-Options "SAMEORIGIN" always; # DEP-03
        try_files $uri $uri/ /index.html;
    }

    # 浏览器统一使用 /api/admin-api/...，转发时去掉 /api 前缀
    location /api/ {
        proxy_pass http://127.0.0.1:48080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # DEP-03：默认 1MB 会阻断图片上传；后端最长链路 ~31s，给 120s 冗余
        client_max_body_size 20m;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:48080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}

# 域名 HTTPS 入口（管理端 + 小程序体验版/正式版共用）
server {
    server_name api.qwer2333.com;
    root /opt/cargo-post-web;
    index index.html;

    # DEP-03：安全基线（HTTPS 额外开 HSTS）
    server_tokens off;
    client_max_body_size 20m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 指纹静态资源长缓存（文件名带 hash，可安全 immutable）
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always; # DEP-03
        try_files $uri =404;
    }

    # index.html 等入口文件禁止启发式缓存（原因同上）
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always; # DEP-03
        add_header X-Frame-Options "SAMEORIGIN" always; # DEP-03
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:48080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # DEP-03：默认 1MB 会阻断图片上传；后端最长链路 ~31s，给 120s 冗余
        client_max_body_size 20m;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:48080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.qwer2333.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.qwer2333.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# 域名 HTTP → HTTPS 跳转
server {
    if ($host = api.qwer2333.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name api.qwer2333.com;
    return 404; # managed by Certbot
}
